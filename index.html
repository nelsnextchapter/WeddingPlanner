</script>
<script>
'use strict';
/* Shared storage (Google Sheet behind a passcode), the passcode screen, media loading, and backups. */

const Remote = {
  token: null,
  forget() { this.token = null; try { localStorage.removeItem('wp:token'); } catch (e) { /* ignore */ } },
  async call(op, data) {
    const fail = code => { const e = new Error(code); e.code = code; return e; };
    let res, j;
    try { res = await fetch(CFG.api.trim(), { method: 'POST', body: JSON.stringify(Object.assign({ op, token: this.token }, data || {})) }); } catch (e) { throw fail('network'); }
    try { j = await res.json(); } catch (e) { throw fail('bad_response'); }
    if (!j || !j.ok) throw fail((j && j.error) || 'error');
    return j;
  }
};

const Gate = {
  box(html) { const el = $('#gate'); el.innerHTML = `<div class="gate-box"><span class="mono gate-mono"><i>&amp;</i></span>${html}</div>`; el.classList.add('show'); return el; },
  hide() { const el = $('#gate'); el.classList.remove('show'); el.innerHTML = ''; },
  loading() { this.box('<h2>Opening the planner…</h2><p class="muted">Fetching the latest version.</p>'); },
  msg(code) {
    return ({ bad_pass: 'That passcode did not match. Check it and try again.', locked: 'Too many wrong tries. Wait 10 minutes, then try again.',
      no_passcode: 'The planner’s storage has no passcode yet. Whoever set it up needs to put one in the first line of the Google script and deploy it again.',
      network: 'The planner’s storage could not be reached. Check your internet connection.', bad_response: 'The storage link in config.js does not seem to point at the planner’s Google script. Check that it ends in /exec and that the script is deployed for “Anyone”.' })[code] || 'Something went wrong on the storage side. Try again in a moment.';
  },
  login() {
    return new Promise(res => {
      const draw = (err, busy) => {
        const el = this.box(`<h2>Wedding planner</h2><p class="muted">Enter the passcode you were given to open it.</p><form id="gate-form"><input type="password" id="gate-pass" autocomplete="current-password" aria-label="Passcode" placeholder="Passcode"${busy ? ' disabled' : ''}><p class="gate-err" role="alert">${esc(err || '')}</p><button class="btn" type="submit"${busy ? ' disabled' : ''}>${busy ? 'Checking…' : 'Open the planner'}</button></form>`);
        const inp = el.querySelector('#gate-pass'); if (!busy) inp.focus();
        el.querySelector('#gate-form').onsubmit = async ev => {
          ev.preventDefault(); const pass = inp.value; if (!pass) return; draw('', true);
          try { const r = await Remote.call('login', { pass }); Remote.token = r.token; try { localStorage.setItem('wp:token', r.token); } catch (e) { /* ignore */ } res(); }
          catch (e) { draw(this.msg(e.code)); }
        };
      };
      draw('');
    });
  },
  error(e) { return new Promise(res => { const el = this.box(`<h2>Could not open the planner</h2><p class="gate-err" role="alert">${esc(this.msg(e.code))}</p><button class="btn" type="button" id="gate-retry">Try again</button>`); el.querySelector('#gate-retry').onclick = () => res(); }); }
};

/* tiny IndexedDB cache so photos load once per device */
const Idb = {
  open() { return this.p || (this.p = new Promise(res => { try { const r = indexedDB.open('wp-media', 1); r.onupgradeneeded = () => r.result.createObjectStore('m'); r.onsuccess = () => res(r.result); r.onerror = () => res(null); } catch (e) { res(null); } })); },
  async get(id) { const db = await this.open(); if (!db) return null; return new Promise(res => { try { const q = db.transaction('m').objectStore('m').get(id); q.onsuccess = () => res(q.result || null); q.onerror = () => res(null); } catch (e) { res(null); } }); },
  async put(id, blob) { const db = await this.open(); if (!db) return; try { db.transaction('m', 'readwrite').objectStore('m').put(blob, id); } catch (e) { /* ignore */ } },
  async del(id) { const db = await this.open(); if (!db) return; try { db.transaction('m', 'readwrite').objectStore('m').delete(id); } catch (e) { /* ignore */ } },
  async clear() { const db = await this.open(); if (!db) return; return new Promise(res => { try { const t = db.transaction('m', 'readwrite'); t.objectStore('m').clear(); t.oncomplete = () => res(); t.onerror = () => res(); } catch (e) { res(); } }); }
};
const blobToDataUrl = blob => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(new Error('read')); r.readAsDataURL(blob); });
function dataUrlToBlob(u) { const i = u.indexOf(','), type = (u.slice(5, i).split(';')[0]) || 'application/octet-stream', bin = atob(u.slice(i + 1)), a = new Uint8Array(bin.length); for (let k = 0; k < bin.length; k++) a[k] = bin.charCodeAt(k); return new Blob([a], { type }); }

const Media = {
  q: [], active: 0, asked: {},
  want(id) { if (this.asked[id]) return; this.asked[id] = 1; this.q.push(id); this.pump(); },
  pump() { while (this.active < 3 && this.q.length) { const id = this.q.shift(); this.active++; this.show(id).then(() => { this.active--; this.pump(); }); } },
  async blob(id) { let b = await Idb.get(id); if (!b) { const r = await Remote.call('mediaGet', { id }); b = dataUrlToBlob('data:' + r.type + ';base64,' + r.b64); Idb.put(id, b); } return b; },
  async show(id) {
    try { const b = await this.blob(id); GC[id] = URL.createObjectURL(b); $$('[data-g]').forEach(el => { if (el.dataset.g === id) el.src = GC[id]; }); }
    catch (e) { if (e.code === 'network') delete this.asked[id]; else { GFAIL[id] = 1; if (typeof render === 'function' && Store.mode === 'sheet') render(); } }
  },
  async put(blob, name) {
    const u = await blobToDataUrl(blob), r = await Remote.call('mediaPut', { name, type: blob.type, b64: u.slice(u.indexOf(',') + 1) });
    GC[r.id] = URL.createObjectURL(blob); this.asked[r.id] = 1; Idb.put(r.id, blob); return { g: r.id };
  },
  del(id) { Remote.call('mediaDel', { id }).catch(() => {}); Idb.del(id); delete GC[id]; }
};

/* ---------- backup and restore ---------- */
const mediaRefs = st => { const out = []; ['hero', 'photo2', 'photo3', 'photo4'].forEach(k => { if (st.settings && st.settings[k]) out.push([st.settings, k]); }); ((st.vision && st.vision.board) || []).forEach(b => { if (b.img) out.push([b, 'img']); }); return out; };
async function refToDataUrl(p) {
  try {
    if (p.d) return S.photos[p.d] || null;
    if (p.g) return await blobToDataUrl(await Media.blob(p.g));
    if (p.a) { const r = await fetch('/_blob/' + p.a); if (!r.ok) return null; return await blobToDataUrl(await r.blob()); }
  } catch (e) { /* skip this one */ }
  return null;
}
async function exportBackup() {
  toast('Preparing your backup…');
  const data = {}; KEYS.forEach(k => { data[k] = clone(S[k]); });
  const media = {}; let n = 0, missed = 0;
  for (const [o, k] of mediaRefs(data)) { const u = await refToDataUrl(o[k]); if (u) { const id = 'm' + (n++); media[id] = u; o[k] = { x: id }; } else { o[k] = null; missed++; } }
  if (data.vision && data.vision.board) data.vision.board = data.vision.board.filter(b => b.img);
  await saveFile('wedding-planner-backup-' + isoD(today()) + '.json', JSON.stringify({ app: 'wedding-planner', version: 1, saved: new Date().toISOString(), data, media }));
  if (missed) toast(plural(missed, 'photo') + ' could not be included in the backup.');
}
async function importBackup() {
  const f = (await pickFiles('.json,application/json', false))[0]; if (!f) return;
  let b; try { b = JSON.parse(await f.text()); } catch (e) { b = null; }
  if (!b || b.app !== 'wedding-planner' || !b.data) { toast('That file is not a planner backup.'); return; }
  if (!await confirmBox('Replace <b>everything</b> in this planner with the backup from ' + esc(fmtShort(new Date(b.saved || Date.now()))) + '? This cannot be undone.', 'Replace with backup', true)) return;
  const refs = mediaRefs(b.data); let done = 0, missed = 0;
  for (const [o, k] of refs) {
    const u = o[k] && o[k].x ? (b.media || {})[o[k].x] : null; o[k] = null; if (!u) { missed++; continue; }
    toast(`Restoring photos and videos: ${++done} of ${refs.length}…`);
    try { const blob = dataUrlToBlob(u), vid = blob.type.startsWith('video/'); const m = await storeMedia(new File([blob], vid ? (blob.type === 'video/webm' ? 'clip.webm' : 'clip.mp4') : 'photo.jpg', { type: blob.type })); o[k] = m.img; if (o.id && k === 'img') o.kind = m.kind; }
    catch (e) { missed++; }
  }
  if (b.data.vision && b.data.vision.board) b.data.vision.board = b.data.vision.board.filter(x => x.img);
  const fresh = freshState();
  KEYS.forEach(k => { S[k] = Object.assign({}, fresh[k], b.data[k] ? clone(b.data[k]) : {}); });
  try { migrate(); } catch (e) { /* keep going */ }
  Store.force = true; KEYS.forEach(k => Store.save(k)); render();
  toast(missed ? `Backup restored, but ${plural(missed, 'photo or video', 'photos or videos')} could not be brought over.` : 'Backup restored.');
}
function shareCard() {
  const shared = Store.mode === 'sheet';
  return card(shared ? 'Sharing and backup' : 'Backup', `
    ${shared ? '<p class="sm-t">This planner is shared. Anyone with the link and the passcode can see and change it, and every change is saved for everyone. If two people edit the same tab at the same moment, the planner keeps the first change and asks the second person to redo theirs.</p>'
      : STANDALONE ? '<div class="note"><span><strong>Not connected to shared storage yet.</strong> Changes are only saved in this browser. Follow the setup guide to connect your Google Sheet.</span></div>' : ''}
    <div class="row"><button class="btn ghost sm" data-act="backup.save" data-tip="Saves everything in the planner, photos included, as one file on this device">Download a backup</button><button class="btn ghost sm" data-act="backup.load" data-tip="Replaces everything in the planner with a backup file">Restore from a backup</button>${shared ? '<span class="top-sp"></span><button class="btn ghost sm" data-act="share.signout" data-tip="Forgets the passcode on this device. Use this on a computer that is not yours.">Sign out on this device</button>' : ''}</div>`, { tone: 'b', tip: 'A backup is a single file with all your entries and photos. Keep one somewhere safe now and then.' });
}

</script>
<script>
'use strict';
/* Actions, event wiring, startup. */

function migrate() {
  const v = S.vendors;
  if (!Array.isArray(v.sections)) {
    v.sections = VENDOR_SECTIONS.map((n, i) => ({ id: 'vs' + i, name: n, rows: [] }));
    (v.list || []).forEach(r => {
      const name = VENDOR_TYPE_SECTION[r.type] || 'Other vendors';
      let sec = v.sections.find(x => x.name === name); if (!sec) { sec = { id: 'vsx', name, rows: [] }; v.sections.push(sec); }
      const row = Object.assign({}, r); if (!VENDOR_TYPE_SECTION[r.type] && r.type && r.type !== 'Other') row.notes = [r.type, r.notes].filter(Boolean).join(' · ');
      delete row.type; sec.rows.push(row);
    });
    v.list = [];
  }
  v.sections.forEach(x => { if (!Array.isArray(x.rows)) x.rows = []; });
  const c = S.checklist; if (!c.order || typeof c.order !== 'object') c.order = {};
  const t = S.timeline; if (!t.ok || typeof t.ok !== 'object') t.ok = {};
  if (!t.flexInit) { t.events.forEach(e => { if (e.flex === undefined && /cocktail hour|dinner is served|tucked away|mimosa and coffee hour/i.test(e.title || '')) e.flex = true; }); t.flexInit = true; }
  S.party.jobs.forEach(j => { if (j.cat === undefined) j.cat = 'Day of'; if (j.due === undefined) j.due = ''; });
  if (!S.settings.custom.c) S.settings.custom.c = '#FF7F68';
}
function freshState() { const s = defaultState(); s.timeline.events = buildTimeline(s.timeline.form); return s; }
const focusRow = (path, id) => { const el = $(`#main [data-bind^="${CSS.escape(path + '.#' + id + '.')}"]`); if (el) el.focus(); };
const saveRender = key => { Store.save(key); render(); };

const ACT = {
  ui(a) { UI[a.dataset.k] = a.dataset.v; render(); },
  'tips.toggle'() { S.settings.tips = !S.settings.tips; saveRender('settings'); },
  started() { S.settings.started = true; saveRender('settings'); },
  'theme.set'(a) { S.settings.theme = a.dataset.v; saveRender('settings'); },
  async 'samples.clear'() {
    if (!await confirmBox('Remove every sample guest, table, expense and floor-plan piece? Anything you added yourself stays.', 'Clear sample entries')) return;
    const gone = new Set(S.seating.tables.filter(t => t.sample).map(t => t.id));
    S.guests.list = S.guests.list.filter(g => !g.sample); S.guests.list.forEach(g => { if (gone.has(g.table)) g.table = ''; });
    S.seating.tables = S.seating.tables.filter(t => !t.sample);
    S.budget.items = S.budget.items.filter(i => !i.sample);
    S.floor.shapes = S.floor.shapes.filter(s => !s.sample);
    S.settings.samples = false; UI.fpSel = null;
    ['guests', 'seating', 'budget', 'floor', 'settings'].forEach(k => Store.save(k)); render(); toast('Sample entries cleared.');
  },
  async 'photo.set'(a) { const p = await pickPhoto(); if (!p) return; const r = walk(a.dataset.path); if (!r) return; dropPhoto(r[0][r[1]]); setPath(a.dataset.path, p); render(); },
  async 'photo.del'(a) { if (!await confirmBox('Remove this photo?', 'Remove', true)) return; const r = walk(a.dataset.path); if (!r) return; dropPhoto(r[0][r[1]]); setPath(a.dataset.path, null); render(); },
  'row.add'(a) {
    const path = a.dataset.path; let arr = getPath(path);
    if (!Array.isArray(arr)) { setPath(path, []); arr = getPath(path); }
    const row = Object.assign({ id: uid('r') }, JSON.parse(a.dataset.tpl || '{}')); arr.push(row);
    if (row.cat) UI.budgetOpen[row.cat] = true;
    saveRender(path.split('.')[0]); focusRow(path, row.id);
  },
  'row.del'(a) {
    const path = a.dataset.path, arr = getPath(path); if (!Array.isArray(arr)) return;
    const i = arr.findIndex(x => x.id === a.dataset.id); if (i < 0) return;
    const [gone] = arr.splice(i, 1), key = path.split('.')[0];
    saveRender(key); toast('Removed.', () => { arr.splice(i, 0, gone); saveRender(key); });
  },
  mv(a) { const arr = getPath(a.dataset.path), i = arr.findIndex(x => x.id === a.dataset.id), j = i + Number(a.dataset.v); if (i < 0 || j < 0 || j >= arr.length) return; [arr[i], arr[j]] = [arr[j], arr[i]]; saveRender(a.dataset.path.split('.')[0]); },

  /* guests */
  'guest.add'() {
    const g = { id: uid('g'), first: '', last: '', party: '', group: UI.guestGroup !== 'all' ? UI.guestGroup : '', street: '', city: '', state: '', zip: '', email: '', phone: '', std: false, inv: false, rsvp: UI.guestRsvp !== 'all' ? UI.guestRsvp : 'awaiting', meal: '', diet: '', table: '', gift: '', thanks: false };
    S.guests.list.push(g); UI.guestQ = ''; saveRender('guests'); focusRow('guests.list', g.id);
    const tw = $('#guest-tw'); if (tw) tw.scrollLeft = 0;
  },
  'guest.copy'(a) { const env = a.dataset.v === 'env'; copyText(toTSV(guestRowsTSV(!env)), env ? 'Addresses' : 'Guest list'); },
  'guest.csv'() { saveFile('guest-list.csv', toCSV(guestRowsTSV(true))); },
  async 'guest.paste'() {
    const text = await modal(`<h3>Paste guests from a spreadsheet</h3><p class="muted sm-t">Copy rows from Excel, Google Sheets or Numbers and paste them below. Columns, in this order: First name, Last name, Name on envelope, Group, Street, City, State, ZIP, Email, Phone. Only the first column is required.</p><textarea rows="9" id="m-paste" placeholder="Jordan&#9;Lee&#9;Mr. &amp; Mrs. Jordan Lee&#9;Family&#9;12 Oak St&#9;Springfield&#9;ST&#9;00001"></textarea>`, 'Add these guests', { read: m => m.querySelector('#m-paste').value });
    if (!text || !text.trim()) return;
    const split = line => line.includes('\t') ? line.split('\t') : (line.match(/("([^"]|"")*"|[^,]*)(,|$)/g) || []).map(c => c.replace(/,$/, '').replace(/^"|"$/g, '').replace(/""/g, '"')).slice(0, -1);
    let n = 0;
    text.split(/\r?\n/).forEach(line => {
      if (!line.trim()) return; let c = split(line).map(x => x.trim());
      if (/^first/i.test(c[0] || '')) return;
      if (c.length === 1 && c[0].includes(' ')) { const i = c[0].lastIndexOf(' '); c = [c[0].slice(0, i), c[0].slice(i + 1)]; }
      const group = c[3] || ''; if (group && !S.guests.groups.includes(group)) S.guests.groups.push(group);
      S.guests.list.push({ id: uid('g'), first: c[0] || '', last: c[1] || '', party: c[2] || '', group, street: c[4] || '', city: c[5] || '', state: c[6] || '', zip: c[7] || '', email: c[8] || '', phone: c[9] || '', std: false, inv: false, rsvp: 'awaiting', meal: '', diet: '', table: '', gift: '', thanks: false }); n++;
    });
    saveRender('guests'); toast(plural(n, 'guest') + ' added.');
  },

  /* seating */
  'table.add'() { const t = { id: uid('tb'), name: 'Table ' + (S.seating.tables.length + 1), cap: 8 }; S.seating.tables.push(t); saveRender('seating'); },
  async 'table.del'(a) {
    const t = S.seating.tables.find(x => x.id === a.dataset.id); if (!t) return;
    const n = S.guests.list.filter(g => g.table === t.id).length;
    if (n && !await confirmBox(`Remove ${esc(t.name)}? Its ${plural(n, 'guest')} will go back to “Not yet seated”.`, 'Remove table', true)) return;
    S.guests.list.forEach(g => { if (g.table === t.id) g.table = ''; });
    S.floor.shapes.forEach(s => { if (s.table === t.id) s.table = ''; });
    S.seating.tables = S.seating.tables.filter(x => x.id !== t.id);
    Store.save('guests'); Store.save('floor'); saveRender('seating');
  },
  'seat.add'(el) { const g = S.guests.list.find(x => x.id === el.value); if (g) { g.table = el.dataset.id; saveRender('guests'); } },
  'seat.remove'(a) { const g = S.guests.list.find(x => x.id === a.dataset.id); if (g) { g.table = ''; saveRender('guests'); } },
  'seat.copy'() { copyText(cateringTSV(), 'Meal counts'); },

  /* floor plan */
  'fp.add'(a) {
    const p = FP_PRESETS.find(x => x.k === a.dataset.v), f = S.floor, n = f.shapes.length % 6;
    const s = { id: uid('f'), kind: p.kind, x: r2(num(f.w) / 2 + n * 1.5 - 3), y: r2(num(f.h) / 2 + n * 1.5 - 3), w: p.w, h: p.h, rot: 0, label: p.label, fill: p.fill, seats: p.seats };
    if (p.one) s.one = true; if (p.chairs) s.chairs = true;
    f.shapes.push(s); UI.fpSel = s.id; saveRender('floor');
  },
  'fp.dup'() { const s = fpShape(UI.fpSel); if (!s) return; const c = Object.assign({}, s, { id: uid('f'), x: s.x + 2, y: s.y + 2, table: '' }); delete c.sample; S.floor.shapes.push(c); UI.fpSel = c.id; saveRender('floor'); },
  'fp.del'() {
    const i = S.floor.shapes.findIndex(s => s.id === UI.fpSel); if (i < 0) return;
    const [gone] = S.floor.shapes.splice(i, 1); UI.fpSel = null; saveRender('floor');
    toast('Shape removed.', () => { S.floor.shapes.splice(i, 0, gone); UI.fpSel = gone.id; saveRender('floor'); });
  },
  'fp.fill'(a) { const s = fpShape(UI.fpSel); if (s) { s.fill = a.dataset.v; saveRender('floor'); } },
  'fp.fromSeating'() {
    const f = S.floor, todo = S.seating.tables.filter(t => !f.shapes.some(s => s.table === t.id)), W = num(f.w), cols = Math.max(1, Math.floor((W - 8) / 10));
    todo.forEach((t, i) => f.shapes.push({ id: uid('f'), kind: 'circle', x: 8 + (i % cols) * 10, y: Math.min(num(f.h) - 5, 8 + Math.floor(i / cols) * 10), w: 5, h: 5, rot: 0, label: '', fill: 'p', seats: num(t.cap) || 8, table: t.id }));
    saveRender('floor'); toast(plural(todo.length, 'table') + ' added. Drag them into place.');
  },

  /* budget */
  'budget.addItem'(a) {
    const it = { id: uid('b'), cat: a.dataset.cat, name: a.dataset.v, budget: a.dataset.amt ? num(a.dataset.amt) : '', actual: '', paid: '', payer: '', due: '', notes: '' };
    S.budget.items.push(it); UI.budgetOpen[it.cat] = true; saveRender('budget');
    const el = $(`#main [data-bind="${CSS.escape('budget.items.#' + it.id + '.budget')}"]`); if (el) el.focus();
  },
  'budget.resetPct'() { S.budget.pct = {}; saveRender('budget'); },

  /* checklist */
  'cl.add'(form) { const inp = form.querySelector('input'), text = inp.value.trim(); if (!text) return; S.checklist.custom.push({ id: uid('k'), phase: form.dataset.ph, text }); UI.phOpen[form.dataset.ph] = true; saveRender('checklist'); },
  'cl.del'(a) { S.checklist.custom = S.checklist.custom.filter(x => x.id !== a.dataset.id); delete S.checklist.done[a.dataset.id]; saveRender('checklist'); },

  /* calendar */
  'cal.nav'(a) {
    const v = a.dataset.v;
    if (v === 'today') UI.calMonth = isoD(today()).slice(0, 7);
    else if (v === 'wed') UI.calMonth = S.settings.date.slice(0, 7);
    else { const [y, m] = UI.calMonth.split('-').map(Number); UI.calMonth = isoD(new Date(y, m - 1 + Number(v), 1)).slice(0, 7); }
    render();
  },
  async 'cal.add'(a) {
    const date = a.dataset.v, title = await modal(`<h3>${esc(fmtLong(parseD(date)))}</h3><label class="field">What is happening?<input type="text" id="m-in" placeholder="Cake tasting, dress fitting, venue tour"></label>`, 'Add to calendar', { read: m => m.querySelector('#m-in').value.trim() });
    if (!title) return; S.calendar.events.push({ id: uid('c'), date, title, notes: '' }); saveRender('calendar');
  },

  /* timeline */
  'tl.who'(a) {
    const e = S.timeline.events.find(x => x.id === a.dataset.id), v = a.dataset.v; if (!e) return;
    let w = new Set(e.who || []);
    if (v === 'all') w = w.has('all') ? new Set() : new Set(['all']); else { w.delete('all'); w.has(v) ? w.delete(v) : w.add(v); }
    e.who = [...w]; saveRender('timeline');
  },
  'tl.add'() {
    const L = tlFor(UI.tlAud), last = L[L.length - 1];
    const e = { id: uid('e'), time: last ? m2t(t2m(last.time) + (num(last.dur) || 30)) : '12:00', dur: 15, title: '', where: '', who: [UI.tlAud] };
    S.timeline.events.push(e); saveRender('timeline');
    const el = $(`#main [data-bind="${CSS.escape('timeline.events.#' + e.id + '.title')}"]`); if (el) el.focus();
  },
  'tl.copy'() { copyText(timelineText(UI.tlAud), 'Timeline'); },
  async 'tl.build'() {
    if (S.timeline.events.length && !await confirmBox('Replace your current timeline with a new draft built from these answers?', 'Replace timeline')) return;
    S.timeline.events = buildTimeline(S.timeline.form); UI.tlAud = 'all'; saveRender('timeline'); toast('New draft built. Adjust anything that does not fit your day.');
  },
  async 'tl.useSample'(a) {
    const s = SAMPLE_TIMELINES.find(x => x.id === a.dataset.v);
    if (S.timeline.events.length && !await confirmBox(`Replace your current timeline with “${esc(s.name)}”?`, 'Replace timeline')) return;
    S.timeline.events = s.rows.map((r, i) => ({ id: uid('e'), time: r[0], dur: s.rows[i + 1] ? Math.min(120, Math.max(0, t2m(s.rows[i + 1][0]) - t2m(r[0]))) : 15, title: r[1], where: '', who: ['all'] }));
    UI.tlAud = 'all'; Store.save('timeline'); location.hash = 'timeline';
  },

  /* details */
  async 'cer.sample'(el) {
    const k = el.value; el.value = ''; if (!k) return;
    if (!await confirmBox('Replace your order of ceremony with this sample?', 'Replace')) return;
    S.ceremony.order = CEREMONY_SAMPLES[k].map(t => ({ id: uid('o'), text: t, who: '' })); saveRender('ceremony');
  },
  'job.clear'() { UI.jobF = UI.jobCat = UI.jobWho = 'all'; render(); },
  'job.add'(a) { const j = { id: uid('j'), task: a.dataset.v, who: UI.jobWho !== 'all' ? UI.jobWho : '', cat: a.dataset.cat || '', due: '', when: '', done: false }; if (UI.jobF === 'done') UI.jobF = 'all'; S.party.jobs.push(j); saveRender('party'); const el = $(`#main [data-bind="${CSS.escape('party.jobs.#' + j.id + '.who')}"]`); if (el) el.focus(); },
  async 'board.add'() {
    const files = await pickFiles('image/*,video/mp4,video/webm,.mp4,.webm', true); if (!files.length) return;
    toast(files.length > 1 ? `Adding ${files.length} files…` : 'Adding to your board…'); let added = 0, err = '';
    for (const f of files) {
      try { const m = await storeMedia(f), n = S.vision.board.length % 8; S.vision.board.push({ id: uid('m'), img: m.img, kind: m.kind, cap: '', x: 4 + n * 5, y: 4 + n * 6, w: 24 }); added++; }
      catch (e) { err = (e && e.message) || 'One file could not be added.'; }
    }
    boardUsageAt = 0; if (added) { UI.boardSel = S.vision.board.at(-1).id; saveRender('vision'); }
    toast(err ? err : added > 1 ? added + ' files added. Drag them where you want them.' : 'Added. Drag it where you want it.');
  },
  async 'board.del'() {
    const b = S.vision.board.find(x => x.id === UI.boardSel); if (!b) return;
    if (!await confirmBox('Remove this from your mood board?', 'Remove', true)) return;
    dropPhoto(b.img); S.vision.board = S.vision.board.filter(x => x !== b); UI.boardSel = null; boardUsageAt = 0; saveRender('vision');
  },
  'board.z'(a) { const L = S.vision.board, i = L.findIndex(x => x.id === UI.boardSel); if (i < 0) return; const [b] = L.splice(i, 1); if (a.dataset.v === '1') L.push(b); else L.unshift(b); saveRender('vision'); },
  'board.tidy'() { const L = S.vision.board, cols = L.length > 12 ? 5 : 4, w = 96 / cols - 2; L.forEach((b, i) => { b.w = r2(w); b.x = r2(2 + (i % cols) * (w + 2)); b.y = r2(3 + Math.floor(i / cols) * (100 / Math.max(3, Math.ceil(L.length / cols)))); }); saveRender('vision'); },
  'board.play'(a) { const v = a.parentElement.querySelector('video'); if (!v) return; if (v.paused) { v.play().catch(() => {}); a.textContent = '❚❚'; } else { v.pause(); a.textContent = '▶'; } },

  /* vendor sections */
  async 'vsec.add'() {
    const name = await modal('<h3>New vendor section</h3><label class="field">What kind of vendor is this for?<input type="text" id="m-in" placeholder="Bakers, rentals, transportation, officiants"></label>', 'Add section', { read: m => m.querySelector('#m-in').value.trim() });
    if (!name) return; const sec = { id: uid('vs'), name, rows: [] }; S.vendors.sections.push(sec); saveRender('vendors');
    const el = document.getElementById('vs-' + sec.id); if (el) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
  },
  async 'vsec.del'(a) {
    const sec = S.vendors.sections.find(x => x.id === a.dataset.id); if (!sec) return;
    if (sec.rows.length && !await confirmBox(`Remove the “${esc(sec.name)}” section and the ${plural(sec.rows.length, 'vendor')} in it?`, 'Remove section', true)) return;
    const i = S.vendors.sections.indexOf(sec); S.vendors.sections.splice(i, 1); saveRender('vendors');
    toast('Section removed.', () => { S.vendors.sections.splice(i, 0, sec); saveRender('vendors'); });
  },
  'vendor.copy'() { copyText(toTSV([['Type', 'Business', 'Contact', 'Phone', 'Email', 'Website or Instagram', 'Notes']].concat(bookedVendors().map(r => [r.type, r.name, r.contact, r.phone, r.email, r.link, r.notes]))), 'Vendor contact list'); },
  'backup.save'() { exportBackup(); },
  'backup.load'() { importBackup(); },
  async 'share.signout'() {
    if (!await confirmBox('Sign out on this device? You will need the passcode to open the planner here again.', 'Sign out')) return;
    await Store.flush(); Remote.call('logout').catch(() => {}); Remote.forget(); await Idb.clear(); location.reload();
  },
  'tl.ok'(a) { S.timeline.ok[a.dataset.v] = true; saveRender('timeline'); }
};

HOOKS.tlShift = (el, kind) => {
  if (kind !== 'change') return;
  const r = walk(el.dataset.bind); if (!r) return; const e = r[0], old = tlSnap[e.id]; if (!old || !e.time) return;
  const isDur = r[1] === 'dur', delta = isDur ? num(e.dur) - old.dur : t2m(e.time) - t2m(old.time); if (!delta) return;
  const cut = isDur ? t2m(old.time) + old.dur : t2m(old.time);
  const later = S.timeline.events.filter(x => x !== e && x.time && (isDur ? t2m(x.time) >= cut : t2m(x.time) > cut || (t2m(x.time) === cut && S.timeline.events.indexOf(x) > S.timeline.events.indexOf(e))));
  if (!later.length) return;
  const amt = Math.abs(delta) + ' min ' + (delta > 0 ? 'later' : 'earlier');
  toast(`“${e.title || 'This moment'}” now ${isDur ? 'ends' : 'starts'} ${amt}. Move the ${plural(later.length, 'moment')} after it too?`, () => {
    const before = later.map(x => [x, x.time]); later.forEach(x => { x.time = m2t(t2m(x.time) + delta); }); saveRender('timeline');
    toast(`${plural(later.length, 'moment')} moved ${amt}.`, () => { before.forEach(([x, t]) => { x.time = t; }); saveRender('timeline'); });
  }, 'Shift them');
};
HOOKS.rsvp = el => { const r = walk(el.dataset.bind); if (r && r[0].rsvp !== 'yes') r[0].table = ''; };
HOOKS.theme = () => { S.settings.theme = 'custom'; applyTheme(); };
HOOKS.fpSize = el => { const r = walk(el.dataset.bind); if (r) { r[0][r[1]] = Math.max(0.5, num(r[0][r[1]]) || 1); } };
HOOKS.fpLink = el => { const r = walk(el.dataset.bind); if (!r) return; const t = S.seating.tables.find(x => x.id === r[0].table); if (t) r[0].seats = num(t.cap) || r[0].seats; };

/* ---------- wiring ---------- */
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]');
  if (a && ACT[a.dataset.act]) { ACT[a.dataset.act](a, e); return; }
  if (e.target.closest('#menu-btn')) { const o = $('#side').classList.toggle('open'); $('#menu-btn').setAttribute('aria-expanded', o); return; }
  if (e.target.closest('#nav a, #brand') || !e.target.closest('#side')) $('#side').classList.remove('open');
});
const runHook = (el, kind) => { const h = el.dataset.hook; if (h && HOOKS[h]) HOOKS[h](el, kind); };
document.addEventListener('input', e => {
  const el = e.target; if (!el.dataset) return;
  if (el.dataset.ui) { UI[el.dataset.ui] = el.value; render(); return; }
  if (!el.dataset.bind || el.type === 'checkbox' || el.tagName === 'SELECT' || el.type === 'date' || el.type === 'time') return;
  setPath(el.dataset.bind, readEl(el)); runHook(el, 'input');
});
document.addEventListener('change', e => {
  const el = e.target; if (!el.dataset) return;
  if (el.dataset.change && ACT[el.dataset.change]) { ACT[el.dataset.change](el); return; }
  if (el.dataset.list) { setPath(el.dataset.list, el.value.split(',').map(s => s.trim()).filter(Boolean)); scheduleRender(); return; }
  if (!el.dataset.bind) return;
  setPath(el.dataset.bind, readEl(el)); runHook(el, 'change');
  if ('quiet' in el.dataset) return;
  if ((el.type === 'date' || el.type === 'time') && document.activeElement === el) { if (!el._pend) { el._pend = true; el.addEventListener('blur', scheduleRender, { once: true }); } }
  else scheduleRender();
});
document.addEventListener('submit', e => { const f = e.target.closest('[data-form]'); if (!f) return; e.preventDefault(); if (ACT[f.dataset.form]) ACT[f.dataset.form](f); });
document.addEventListener('toggle', e => {
  const d = e.target; if (!d.dataset) return;
  if (d.dataset.cat) UI.budgetOpen[d.dataset.cat] = d.open;
  if (d.dataset.ph) { UI.phOpen = UI.phOpen || {}; UI.phOpen[d.dataset.ph] = d.open; }
}, true);
document.addEventListener('keydown', e => { fpKey(e); });

/* drag to reorder (mouse and touch) */
const SORT = {
  rows(cont, id, before, after) { const arr = getPath(cont.dataset.path); if (Array.isArray(arr) && moveItem(arr, id, before, after)) saveRender(cont.dataset.path.split('.')[0]); },
  cl(cont, id, before, after) {
    const ph = cont.dataset.ph, list = (checklistAll().find(p => p.id === ph) || { tasks: [] }).tasks.map(t => ({ id: t.id }));
    if (moveItem(list, id, before, after)) { S.checklist.order[ph] = list.map(x => x.id); saveRender('checklist'); }
  },
  tl(cont, id, before, after) {
    const all = S.timeline.events, e = all.find(x => x.id === id); if (!e) return;
    const vis = tlFor(UI.tlAud).filter(x => x !== e), bi = before ? vis.findIndex(x => x.id === before) : -1;
    const next = bi >= 0 ? vis[bi] : null, prev = bi >= 0 ? vis[bi - 1] : vis[vis.length - 1];
    let start;
    if (prev) { const pe = t2m(prev.time) + num(prev.dur); start = next ? Math.min(pe, t2m(next.time)) : pe; if (start < t2m(prev.time)) start = t2m(prev.time); }
    else if (next) start = t2m(next.time) - num(e.dur); else return;
    e.time = m2t(start); moveItem(all, id, next ? next.id : null, prev ? prev.id : null);
    all.sort((a, b) => t2m(a.time) - t2m(b.time)); saveRender('timeline');
    toast(`“${e.title || 'Moment'}” now starts at ${fmtTime(e.time)}.`);
  }
};
let sortS = null;
document.addEventListener('pointerdown', e => {
  const g = e.target.closest && e.target.closest('[data-grip]'); if (!g) return;
  const row = g.closest('[data-sort-id]'), cont = row && row.closest('[data-sort]'); if (!cont) return;
  e.preventDefault(); sortS = { row, cont, id: row.dataset.sortId, before: undefined, after: null };
  try { g.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  row.classList.add('dragging'); document.body.classList.add('sorting'); hideTip();
});
const sortClear = cont => $$('.drop-before,.drop-after', cont).forEach(r => r.classList.remove('drop-before', 'drop-after'));
document.addEventListener('pointermove', e => {
  if (!sortS) return;
  const rows = $$('[data-sort-id]', sortS.cont).filter(r => r.closest('[data-sort]') === sortS.cont); if (!rows.length) return;
  sortClear(sortS.cont); let target = null;
  for (const r of rows) { const b = r.getBoundingClientRect(); if (e.clientY < b.top + b.height / 2) { target = r; break; } }
  const last = rows[rows.length - 1];
  sortS.before = target ? target.dataset.sortId : null; sortS.after = target ? null : last.dataset.sortId;
  (target || last).classList.add(target ? 'drop-before' : 'drop-after');
  const m = $('#main'), mb = m.getBoundingClientRect(); if (e.clientY < mb.top + 50) m.scrollTop -= 14; else if (e.clientY > mb.bottom - 50) m.scrollTop += 14;
});
const sortEnd = e => {
  if (!sortS) return; const s = sortS; sortS = null;
  sortClear(s.cont); s.row.classList.remove('dragging'); document.body.classList.remove('sorting');
  if (e.type !== 'pointerup' || s.before === undefined || s.before === s.id || s.after === s.id) return;
  const fn = SORT[s.cont.dataset.sort]; if (fn) fn(s.cont, s.id, s.before, s.after);
};
document.addEventListener('pointerup', sortEnd); document.addEventListener('pointercancel', sortEnd);

/* tooltips */
const tipbox = $('#tipbox');
function showTip(el) {
  tipbox.textContent = el.dataset.tip; tipbox.classList.add('show');
  const r = el.getBoundingClientRect(), b = tipbox.getBoundingClientRect();
  let x = r.left + r.width / 2 - b.width / 2, y = r.top - b.height - 8;
  x = Math.max(8, Math.min(window.innerWidth - b.width - 8, x)); if (y < 8) y = r.bottom + 8;
  tipbox.style.left = x + 'px'; tipbox.style.top = y + 'px';
}
const hideTip = () => tipbox.classList.remove('show');
document.addEventListener('mouseover', e => { if (sortS) return; const el = e.target.closest && e.target.closest('[data-tip]'); if (el) showTip(el); else hideTip(); });
document.addEventListener('focusin', e => { const el = e.target.closest && e.target.closest('.tip[data-tip]'); if (el) showTip(el); });
document.addEventListener('focusout', hideTip);
document.addEventListener('scroll', hideTip, true);

/* drag guests between tables */
let dragGid = null;
document.addEventListener('dragstart', e => { const g = e.target.closest && e.target.closest('[data-gid]'); if (!g) return; dragGid = g.dataset.gid; try { e.dataTransfer.setData('text/plain', dragGid); e.dataTransfer.effectAllowed = 'move'; } catch (err) { /* ignore */ } });
document.addEventListener('dragover', e => { const d = e.target.closest && e.target.closest('[data-drop]'); if (!d || !dragGid) return; e.preventDefault(); $$('.drop').forEach(x => x !== d && x.classList.remove('drop')); d.classList.add('drop'); });
document.addEventListener('dragend', () => { dragGid = null; $$('.drop').forEach(x => x.classList.remove('drop')); });
document.addEventListener('drop', e => {
  const d = e.target.closest && e.target.closest('[data-drop]'); if (!d || !dragGid) return; e.preventDefault();
  const g = S.guests.list.find(x => x.id === dragGid); dragGid = null;
  if (g && g.table !== d.dataset.drop) { g.table = d.dataset.drop; saveRender('guests'); } else $$('.drop').forEach(x => x.classList.remove('drop'));
});

/* ---------- start ---------- */
const hashView = () => { const h = location.hash.replace('#', ''); return VIEWS[h] ? h : 'home'; };
window.addEventListener('hashchange', () => go(hashView()));
S = freshState();
if (!SHEET) Store.loadLocal();
migrate();
cur = hashView();
render();
$('#main').inert = true;
const unlock = () => { $('#main').inert = false; };
Store.init().then(() => { try { migrate(); } catch (e) { console.error(e); } unlock(); render(); }).catch(e => { console.error(e); Store.mode = 'offline'; unlock(); setStatus(); });
if (!SHEET) setTimeout(unlock, 25000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) Store.sync(); });
window.addEventListener('focus', () => Store.sync());
setInterval(() => Store.sync(), 60000);
window.addEventListener('beforeunload', e => { if (Store.mode === 'sheet' && (Store.dirty.size || Store.busy)) { e.preventDefault(); e.returnValue = ''; } });

</script>
</body>
