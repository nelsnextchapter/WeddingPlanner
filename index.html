<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wedding Planner</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout idea: a calm cream workbook. Color-coded sections in the sidebar, one arched photo frame as the signature. */
  --a: #E07A2F; --p: #F7C6A3; --g: #9DB089; --b: #8FA9C6; --y: #EDB548; --c: #FF7F68; --bg: #FBF6EC;
  --ink: #3A342C; --muted: #776D60;
  --surface: color-mix(in srgb, var(--bg) 30%, #fff);
  --line: color-mix(in srgb, var(--ink) 13%, var(--bg));
  --track: color-mix(in srgb, var(--ink) 8%, var(--bg));
  --a-deep: color-mix(in srgb, var(--a) 78%, #2b1300); --a-soft: color-mix(in srgb, var(--a) 13%, var(--surface));
  --p-deep: color-mix(in srgb, var(--p) 55%, #5a2a0a);  --p-soft: color-mix(in srgb, var(--p) 34%, var(--surface));
  --g-deep: color-mix(in srgb, var(--g) 58%, #1f2d12);  --g-soft: color-mix(in srgb, var(--g) 24%, var(--surface));
  --b-deep: color-mix(in srgb, var(--b) 58%, #10243b);  --b-soft: color-mix(in srgb, var(--b) 22%, var(--surface));
  --y-deep: color-mix(in srgb, var(--y) 55%, #3d2a00);  --y-soft: color-mix(in srgb, var(--y) 24%, var(--surface));
  --c-deep: color-mix(in srgb, var(--c) 62%, #4a0f05);  --c-soft: color-mix(in srgb, var(--c) 18%, var(--surface));
  --c1: color-mix(in srgb, var(--a) 85%, #c44a00); --c2: color-mix(in srgb, var(--b) 45%, #1d4f9c); --c3: color-mix(in srgb, var(--g) 45%, #4f9418); --c0: color-mix(in srgb, var(--ink) 22%, var(--bg));
  --good: #4F7F3F; --warn: #A66A00; --bad: #B23A2A; --bad-soft: #FBE9E5;
  --f-d: 'Cormorant Garamond', 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
  --f-b: 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --r: 14px; --shadow: 0 1px 2px rgba(58, 52, 44, .05), 0 8px 24px -14px rgba(58, 52, 44, .22);
  color-scheme: light;
}
[data-tone="a"] { --t: var(--a); --t-deep: var(--a-deep); --t-soft: var(--a-soft); }
[data-tone="p"] { --t: var(--p); --t-deep: var(--p-deep); --t-soft: var(--p-soft); }
[data-tone="g"] { --t: var(--g); --t-deep: var(--g-deep); --t-soft: var(--g-soft); }
[data-tone="b"] { --t: var(--b); --t-deep: var(--b-deep); --t-soft: var(--b-soft); }
[data-tone="c"] { --t: var(--c); --t-deep: var(--c-deep); --t-soft: var(--c-soft); }
[data-tone="y"] { --t: var(--y); --t-deep: var(--y-deep); --t-soft: var(--y-soft); }

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 400 15px/1.5 var(--f-b); display: grid; grid-template-columns: 236px minmax(0, 1fr); -webkit-font-smoothing: antialiased; }
h1, h2, h3, p { margin: 0; }
h1 { font: 600 clamp(30px, 4vw, 42px)/1.05 var(--f-d); letter-spacing: -.01em; text-wrap: balance; }
h2 { font: 600 17px/1.3 var(--f-b); letter-spacing: -.005em; }
h3 { font: 600 14px/1.3 var(--f-b); }
a { color: var(--a-deep); }
img { max-width: 100%; display: block; }
.muted { color: var(--muted); } .sm-t { font-size: 13px; } .nowrap { white-space: nowrap; }
:focus-visible { outline: 2px solid var(--a-deep); outline-offset: 2px; border-radius: 4px; }

/* sidebar */
.side { background: var(--surface); border-right: 1px solid var(--line); overflow-y: auto; padding: 18px 14px 28px; display: flex; flex-direction: column; gap: 18px; }
.brand { display: flex; align-items: center; gap: 11px; text-decoration: none; color: var(--ink); padding: 4px 6px; }
.mono { flex: none; width: 46px; height: 56px; border-radius: 999px 999px 8px 8px; background: var(--p-soft); border: 1px solid var(--p); display: grid; place-items: center; font: 600 17px/1 var(--f-d); letter-spacing: 0; white-space: nowrap; padding-top: 6px; }
.mono i { font-style: italic; color: var(--a-deep); padding: 0 1px; font-weight: 500; }
.brand-t { font: 600 19px/1.1 var(--f-d); overflow-wrap: anywhere; }
.brand-t small { display: block; font: 500 11.5px/1.5 var(--f-b); color: var(--muted); letter-spacing: .04em; text-transform: uppercase; margin-top: 3px; }
#nav { display: flex; flex-direction: column; gap: 14px; }
.nav-g { display: flex; flex-direction: column; gap: 1px; }
.nav-h { font: 600 11px/1 var(--f-b); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); padding: 0 8px 6px; display: flex; align-items: center; gap: 7px; }
.nav-h::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--t); }
.nav-g a { text-decoration: none; color: var(--ink); padding: 7px 10px 7px 12px; border-radius: 8px; border-left: 3px solid transparent; font-weight: 500; font-size: 14.5px; }
.nav-g a:hover { background: var(--t-soft); }
.nav-g a.on { background: var(--t-soft); border-left-color: var(--t); font-weight: 600; }

/* shell */
.shell { display: flex; flex-direction: column; min-width: 0; height: 100%; }
.top { display: flex; align-items: center; gap: 12px; padding: 10px 28px; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--bg) 88%, transparent); flex-wrap: wrap; row-gap: 6px; }
.crumb { font-weight: 600; }
.countdown { font: 600 12.5px/1 var(--f-b); background: var(--a-soft); color: var(--a-deep); border: 1px solid color-mix(in srgb, var(--a) 40%, var(--surface)); padding: 6px 11px; border-radius: 999px; font-variant-numeric: tabular-nums; }
.top-sp { flex: 1; }
.save-status { font-size: 12.5px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.save-status::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--good); }
.save-status.busy::before { background: var(--y); } .save-status.warn::before { background: var(--bad); }
.tips-btn, .menu-btn { font: 600 12.5px/1 var(--f-b); padding: 7px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.tips-btn[aria-pressed="true"] { background: var(--g-soft); border-color: var(--g); }
.menu-btn { display: none; }
main { flex: 1; overflow-y: auto; padding: 30px 28px 80px; display: flex; flex-direction: column; gap: 22px; min-width: 0; }
main:focus { outline: none; }
main > * { width: 100%; max-width: 1180px; margin-inline: auto; }
main[inert] { opacity: .75; }

.vh { display: flex; justify-content: space-between; align-items: flex-end; gap: 18px; flex-wrap: wrap; padding-bottom: 14px; border-bottom: 2px solid var(--t, var(--a)); }
.lede { color: var(--muted); max-width: 64ch; margin-top: 8px; }
.vh-x { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* cards & grids */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 20px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.card[data-tone] { border-top: 3px solid var(--t); }
.card-h { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.grid { display: grid; gap: 18px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g-main { grid-template-columns: minmax(0, 2fr) minmax(260px, 1fr); align-items: start; }
.stack { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--t, var(--a)); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tile small { font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .03em; text-transform: uppercase; }
.tile b { font: 600 26px/1.15 var(--f-d); font-variant-numeric: tabular-nums lining-nums; }
.tile span { font-size: 12.5px; color: var(--muted); }
.tile.bad { border-left-color: var(--bad); } .tile.bad b { color: var(--bad); }
.tile input { font: 600 24px/1.1 var(--f-d); width: 100%; padding: 2px 6px; margin-left: -6px; }

/* controls */
input, select, textarea, button { font: inherit; color: inherit; }
input[type="text"], input[type="date"], input[type="time"], input[type="number"], input[type="url"], input.num, select, textarea { background: transparent; border: 1px solid transparent; border-radius: 7px; padding: 6px 8px; width: 100%; min-width: 0; }
.field input, .field select, .field textarea, input.boxed, select.boxed, textarea.boxed { background: var(--surface); border-color: var(--line); }
input:hover, select:hover, textarea:hover { border-color: var(--line); }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--a); background: #fff; box-shadow: 0 0 0 3px var(--a-soft); }
input.num { text-align: right; font-variant-numeric: tabular-nums; }
input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--g-deep); cursor: pointer; margin: 0; vertical-align: middle; }
input[type="range"] { width: 100%; accent-color: var(--a-deep); }
input[type="color"] { width: 38px; height: 30px; padding: 0; border: 1px solid var(--line); border-radius: 7px; background: none; cursor: pointer; }
textarea { resize: vertical; min-height: 64px; line-height: 1.45; }
.field { display: block; font-size: 12.5px; font-weight: 600; color: var(--muted); min-width: 0; }
.field > input, .field > select, .field > textarea { display: block; margin-top: 4px; }
.field input, .field select, .field textarea { font-size: 15px; font-weight: 400; color: var(--ink); padding: 8px 10px; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.btn { font: 600 13.5px/1 var(--f-b); padding: 10px 15px; border-radius: 999px; border: 1px solid var(--a-deep); background: var(--a-deep); color: #fff; cursor: pointer; white-space: nowrap; }
.btn:hover { filter: brightness(1.07); }
.btn.ghost { background: transparent; color: var(--a-deep); border-color: color-mix(in srgb, var(--a) 45%, var(--surface)); }
.btn.ghost:hover { background: var(--a-soft); filter: none; }
.btn.sm { padding: 7px 11px; font-size: 12.5px; }
.btn.danger { background: var(--bad); border-color: var(--bad); }
.card > .btn, .cat-b > .btn, .stack > .btn { align-self: flex-start; }
.grid.top { align-items: start; }
.money-in { display: flex; align-items: baseline; font: 600 24px/1.1 var(--f-d); }
.dl-only { display: none; } .can-download .dl-only { display: inline-block; }
.x { border: 0; background: none; color: var(--muted); font-size: 18px; line-height: 1; width: 28px; height: 28px; border-radius: 50%; cursor: pointer; }
.x:hover { background: var(--bad-soft); color: var(--bad); }
.seg { display: inline-flex; background: var(--track); padding: 3px; border-radius: 999px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 6px 12px; border-radius: 999px; font: 600 12.5px/1 var(--f-b); color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(58, 52, 44, .18); }
.pill { display: inline-block; font: 600 11.5px/1 var(--f-b); padding: 4px 8px; border-radius: 999px; background: var(--t-soft, var(--track)); color: var(--t-deep, var(--muted)); border: 1px solid color-mix(in srgb, var(--t, var(--line)) 55%, var(--surface)); white-space: nowrap; }
.pill[data-tone="bad"] { background: var(--bad-soft); color: var(--bad); border-color: color-mix(in srgb, var(--bad) 35%, #fff); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { font: 500 12.5px/1 var(--f-b); padding: 6px 10px; border-radius: 999px; border: 1px dashed color-mix(in srgb, var(--ink) 28%, var(--bg)); background: none; color: var(--ink); cursor: pointer; }
.chip:hover { border-style: solid; border-color: var(--a); background: var(--a-soft); }
.chip.fg { border-color: color-mix(in srgb, var(--y-deep) 45%, var(--bg)); }
.chips-l { font-size: 12px; font-weight: 600; color: var(--muted); margin-right: 2px; }
.tip { display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; background: var(--b-soft); color: var(--b-deep); border: 1px solid color-mix(in srgb, var(--b) 60%, var(--surface)); font: 700 10.5px/1 var(--f-b); margin-left: 6px; cursor: help; vertical-align: 1px; text-transform: none; letter-spacing: 0; }
.no-tips .tip { display: none; }
.tipbox { position: fixed; z-index: 60; max-width: 270px; background: var(--ink); color: #fff; font-size: 12.5px; line-height: 1.4; padding: 8px 10px; border-radius: 8px; pointer-events: none; opacity: 0; transform: translateY(3px); transition: opacity .12s, transform .12s; box-shadow: 0 6px 20px rgba(0, 0, 0, .2); }
.tipbox.show { opacity: 1; transform: none; }
.note { background: var(--y-soft); border: 1px solid color-mix(in srgb, var(--y) 55%, var(--surface)); border-radius: 12px; padding: 11px 14px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; font-size: 14px; }
.note.info { background: var(--b-soft); border-color: color-mix(in srgb, var(--b) 50%, var(--surface)); }
.toast { position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 20px); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 999px; font-size: 13.5px; display: flex; gap: 12px; align-items: center; opacity: 0; pointer-events: none; transition: .18s; z-index: 70; max-width: calc(100vw - 32px); }
.toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.toast .btn { background: #fff; color: var(--ink); border-color: #fff; }
.modal { position: fixed; inset: 0; background: rgba(58, 52, 44, .45); display: none; place-items: center; z-index: 65; padding: 16px; }
.modal.show { display: grid; }
.modal-box { background: var(--surface); border-radius: 16px; padding: 22px; width: min(560px, 100%); max-height: 90vh; overflow: auto; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 20px 60px rgba(0, 0, 0, .3); }
.modal-box h3 { font: 600 24px/1.1 var(--f-d); }
.modal-f { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }
.copy-area, .modal-box textarea { background: #fff; border: 1px solid var(--line); font: 13px/1.4 ui-monospace, Menlo, monospace; }

/* tables */
.tw { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.et { border-collapse: collapse; width: 100%; font-size: 14px; }
.et th { text-align: left; font: 600 11.5px/1.2 var(--f-b); letter-spacing: .04em; text-transform: uppercase; color: var(--muted); padding: 10px 8px; background: var(--t-soft, var(--track)); border-bottom: 1px solid var(--line); white-space: nowrap; position: sticky; top: 0; }
.et td { padding: 2px 3px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.et tr:last-child td { border-bottom: 0; }
.et tbody tr:hover { background: color-mix(in srgb, var(--t-soft, var(--track)) 45%, transparent); }
.et td.c, .et th.c { text-align: center; }
.et .xcol { width: 34px; min-width: 34px !important; text-align: center; }
.et .empty { padding: 18px; color: var(--muted); text-align: center; }
.et tfoot td { padding: 9px 8px; font-weight: 600; background: var(--track); font-variant-numeric: tabular-nums; }
.et.team td { padding: 9px 8px; }
.calc { display: block; padding: 6px 8px; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.calc.l { text-align: left; }
.pos { color: var(--good); font-weight: 600; } .neg { color: var(--bad); font-weight: 600; }
.stripe { border-left: 4px solid var(--t, transparent); }
tr.booked td:first-child { box-shadow: inset 4px 0 0 var(--good); }

/* photo frames */
.frame { position: relative; overflow: hidden; background: var(--p-soft); border: 1px solid var(--p); border-radius: 12px; aspect-ratio: 4 / 3; }
.frame.arch { border-radius: 999px 999px 14px 14px; aspect-ratio: 3 / 4; }
.frame.sq { aspect-ratio: 1; }
.frame img { width: 100%; height: 100%; object-fit: cover; }
.frame-add { position: absolute; inset: 0; border: 0; background: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: var(--p-deep); font-weight: 600; font-size: 13px; padding: 12px; text-align: center; }
.frame-add .plus { width: 34px; height: 34px; border-radius: 50%; border: 1.5px dashed currentColor; display: grid; place-items: center; font-size: 20px; line-height: 1; }
.frame-add:hover { background: color-mix(in srgb, var(--p) 30%, transparent); }
.frame-x, .frame-swap { position: absolute; border: 0; background: rgba(58, 52, 44, .7); color: #fff; cursor: pointer; opacity: 0; transition: opacity .12s; }
.frame-x { top: 8px; right: 8px; width: 28px; height: 28px; border-radius: 50%; font-size: 16px; }
.frame.arch .frame-x { top: 50%; right: 8px; }
.frame-swap { bottom: 8px; left: 50%; transform: translateX(-50%); border-radius: 999px; padding: 5px 12px; font-size: 12px; font-weight: 600; }
.frame:hover .frame-x, .frame:hover .frame-swap, .frame-x:focus-visible, .frame-swap:focus-visible { opacity: 1; }
@media (hover: none) { .frame-x, .frame-swap { opacity: 1; } }

/* charts */
.chart { min-height: 210px; display: flex; flex-direction: column; gap: 12px; justify-content: center; }
.legend { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.legend b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.donut { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.donut svg { width: 150px; height: 150px; flex: none; }
.donut .legend { flex-direction: column; gap: 8px; font-size: 13.5px; }
.donut-n { font: 600 30px var(--f-d); fill: var(--ink); } .donut-s { font: 600 10px var(--f-b); fill: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.arc { transition: stroke-width .12s; cursor: default; } .arc:hover { stroke-width: 18; }
.hb { display: flex; flex-direction: column; gap: 7px; }
.hb-r { display: grid; grid-template-columns: minmax(0, 40%) minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 12.5px; }
.hb-l { color: var(--ink); line-height: 1.25; overflow-wrap: anywhere; }
.hb-t.trk { background: var(--track); border-radius: 0 5px 5px 0; border-left: 0; padding: 0; }
.hb-t.trk i { height: 10px; min-width: 0; }
.hb-t { display: flex; flex-direction: column; gap: 2px; border-left: 1px solid var(--line); padding: 1px 0; }
.hb-t i { display: block; height: 8px; min-width: 2px; border-radius: 0 4px 4px 0; }
.hb-t.st { flex-direction: row; background: var(--track); border-radius: 0 5px 5px 0; overflow: hidden; height: 14px; padding: 0; border: 0; }
.hb-t.st i { height: 14px; min-width: 3px; border-radius: 0; }
.hb-v { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; min-width: 44px; text-align: right; }
.bar { height: 10px; background: var(--track); border-radius: 999px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--c3); border-radius: 999px; }

/* home */
.hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(170px, 250px); gap: 30px; align-items: center; padding: 6px 0 4px; }
.hero-k { font: 600 12px/1 var(--f-b); letter-spacing: .14em; text-transform: uppercase; color: var(--a-deep); }
.hero h1 { font-size: clamp(44px, 7vw, 82px); line-height: .95; margin: 12px 0 14px; }
.hero h1 i { font-style: italic; font-weight: 500; color: var(--a-deep); }
.hero h1 .ph-name { color: color-mix(in srgb, var(--ink) 30%, var(--bg)); }
.hero-d { font: 500 22px/1.3 var(--f-d); color: var(--ink); }
.hero-c { display: flex; align-items: baseline; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
.hero-c b { font: 600 64px/1 var(--f-d); font-variant-numeric: lining-nums; color: var(--g-deep); }
.hero-c span { font-weight: 600; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; font-size: 13px; }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.sw { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 8px 10px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; font-weight: 600; min-width: 108px; text-align: left; }
.sw[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 2px var(--ink); }
.sw span.dots { display: flex; } .sw span.dots i { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--surface); margin-right: -6px; }
.steps { counter-reset: s; list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
.steps li { counter-increment: s; padding-left: 40px; position: relative; font-size: 14px; }

/* timeline */
.tl { display: flex; flex-direction: column; }

.who { display: flex; gap: 3px; flex-wrap: wrap; }

.ph { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); overflow: hidden; }

/* calendar */
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); }

.cal .day.out { background: var(--track); opacity: .55; }
.cal .day:hover { background: var(--y-soft); }
.cal .dn { font-weight: 600; font-size: 12.5px; width: 22px; height: 22px; display: grid; place-items: center; border-radius: 50%; }
.cal .today .dn { background: var(--ink); color: #fff; }

.ev { display: block; border-radius: 5px; padding: 2px 5px; background: var(--t-soft); color: var(--t-deep); border-left: 3px solid var(--t); font-weight: 600; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* vision */

'use strict';

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = (p = 'x') => p + Math.random().toString(36).slice(2, 9);
const num = v => { const n = parseFloat(String(v ?? '').replace(/[^0-9.\-]/g, '')); return isFinite(n) ? n : 0; };
const sum = (arr, f) => arr.reduce((t, x) => t + num(typeof f === 'function' ? f(x) : x[f]), 0);
const money = n => (n < 0 ? '−$' : '$') + Math.abs(Math.round(n)).toLocaleString('en-US');
const pct = (a, b) => b > 0 ? Math.round(a / b * 100) : 0;
const plural = (n, w, ws) => n + ' ' + (n === 1 ? w : (ws || w + 's'));

/* ---------- dates ---------- */
const parseD = s => { if (!s) return null; const [y, m, d] = s.split('-').map(Number); return (y && m && d) ? new Date(y, m - 1, d) : null; };
const isoD = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');

  if (Store.assets) {
    try { const big = await scaleImage(file, 1800, 0.86); const r = await Store.assets.upload(big.blob, { type: 'image/jpeg' }); return { a: r.id }; }
    catch (e) { /* fall through to the small in-planner copy */ }
  }
  let small = await scaleImage(file, 900, 0.72);
  if (small.url.length > 230000) small = await scaleImage(file, 620, 0.6);
  if (small.url.length > 240000) throw new Error('That photo is too large to store here. Try a smaller one.');
  const id = uid('p'); S.photos[id] = small.url; Store.save('ph-' + id); return { d: id };
}
function pickFiles(accept, multiple) {
  return new Promise(res => {
    const i = document.createElement('input'); i.type = 'file'; i.accept = accept; i.multiple = !!multiple; i.style.display = 'none'; document.body.appendChild(i);
    i.onchange = () => { const f = [...i.files]; i.remove(); res(f); };
    i.click();
  });
}
async function pickPhoto() {
  const f = (await pickFiles('image/*', false))[0]; if (!f) return null;
  toast('Adding your photo…');
  try { return await storePhoto(f); } catch (e) { toast(e.code ? 'That photo could not be saved. Check your connection and try again.' : (e.message || 'That photo could not be added.')); return null; }
}
async function storeMedia(f) {
  if (f.type.startsWith('video/') || /\.(mp4|webm|mov|m4v)$/i.test(f.name)) {
    const type = /webm/i.test(f.type + f.name) ? 'video/webm' : (f.type === 'video/mp4' || /\.mp4$/i.test(f.name)) ? 'video/mp4' : null;
    if (!type) throw new Error('Videos need to be MP4 or WebM files. An iPhone .MOV clip has to be converted to MP4 first.');
    if (Store.mode === 'sheet') {
      if (f.size > 12 * 1024 * 1024) throw new Error('That video is over 12 MB, which is too big for the shared planner. Trim it or export a smaller version.');
      return { img: await Media.put(f.slice(0, f.size, type), 'clip.' + (type === 'video/webm' ? 'webm' : 'mp4')), kind: 'vid' };
    }
    if (f.size > 20 * 1024 * 1024) throw new Error('That video is over 20 MB. Trim it or export a smaller version.');
    if (!Store.assets) throw new Error('Videos cannot be stored from this view of the planner.');
    const r = await Store.assets.upload(f, { type }); return { img: { a: r.id }, kind: 'vid' };
  }
  return { img: await storePhoto(f), kind: 'img' };
}
function dropPhoto(p) {
  if (!p) return;
  if (p.a && Store.assets) Store.assets.delete(p.a).catch(() => {});
  if (p.g) Media.del(p.g);
  if (p.d) { delete S.photos[p.d]; Store.save('ph-' + p.d); }
}
function frame(path, cls, label) {
  const r = walk(path), p = r ? r[0][r[1]] : null, src = photoSrc(p);
  return `<div class="frame ${cls || ''}">${src
    ? `<img src="${esc(src)}"${gAttr(p)} alt="${esc(label || 'Your photo')}"><button class="frame-x" data-act="photo.del" data-path="${path}" aria-label="Remove photo" data-tip="Remove photo">×</button><button class="frame-swap" data-act="photo.set" data-path="${path}">Change</button>`
    : `<button class="frame-add" data-act="photo.set" data-path="${path}"><span class="plus">+</span><span>${esc(label || 'Add a photo')}</span></button>`}</div>`;
}

/* ---------- charts ---------- */
const CH = ['var(--c1)', 'var(--c2)', 'var(--c3)', 'var(--c0)'];
const legend = items => `<ul class="legend">${items.map(i => `<li><i style="background:${i.color}"></i>${esc(i.label)}${i.value != null ? ` <b>${esc(i.value)}</b>` : ''}</li>`).join('')}</ul>`;
function donut(segs, center, sub) {
  const total = sum(segs, 'value'), R = 54, C = 2 * Math.PI * R, gap = 2.5; let off = 0;
  const arcs = total > 0 ? segs.filter(s => s.value > 0).map(s => {
    const len = s.value / total * C, d = Math.max(len - gap, 0.5);
    const a = `<circle class="arc" r="${R}" cx="70" cy="70" fill="none" stroke="${s.color}" stroke-width="15" stroke-dasharray="${d.toFixed(2)} ${(C - d).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" data-tip="${esc(s.label)}: ${esc(s.show ?? s.value)} (${pct(s.value, total)}%)"></circle>`;
    off += len; return a;
  }).join('') : '';
  return `<div class="donut"><svg viewBox="0 0 140 140" role="img" aria-label="${esc(segs.map(s => s.label + ' ' + (s.show ?? s.value)).join(', '))}"><circle r="${R}" cx="70" cy="70" fill="none" stroke="var(--track)" stroke-width="15"></circle><g transform="rotate(-90 70 70)">${arcs}</g><text x="70" y="68" text-anchor="middle" class="donut-n">${esc(center)}</text><text x="70" y="86" text-anchor="middle" class="donut-s">${esc(sub || '')}</text></svg>${legend(segs.map(s => ({ color: s.color, label: s.label, value: s.show ?? s.value })))}</div>`;
}
/* rows: [{label, bars:[{v, color, name, show}], note}] ; one shared scale */
function hbars(rows, opts = {}) {
  const max = opts.max || Math.max(1, ...rows.flatMap(r => r.bars.map(b => b.v)));
  const names = opts.legend ? legend(opts.legend) : '';
  return `${names}<div class="hb" role="img" aria-label="${esc(opts.label || 'Bar chart')}">${rows.map(r => `<div class="hb-r"><span class="hb-l" title="${esc(r.label)}">${esc(r.label)}</span><div class="hb-t ${opts.track ? 'trk' : ''}">${r.bars.map(b => `<i style="width:${(b.v / max * 100).toFixed(1)}%;background:${b.color}" data-tip="${esc(r.label)}${b.name ? ' · ' + esc(b.name) : ''}: ${esc(b.show ?? b.v)}"></i>`).join('')}</div><span class="hb-v">${esc(r.note ?? '')}</span></div>`).join('')}</div>`;
}
/* rows: [{label, segs:[{v,color,name}], note}] each row is its own 100% */
function stacks(rows, leg) {
  return `${legend(leg)}<div class="hb" role="img" aria-label="Stacked bars">${rows.map(r => { const t = sum(r.segs, 'v'); return `<div class="hb-r"><span class="hb-l" title="${esc(r.label)}">${esc(r.label)}</span><div class="hb-t st">${t ? r.segs.filter(s => s.v > 0).map(s => `<i style="flex:${s.v};background:${s.color}" data-tip="${esc(r.label)} · ${esc(s.name)}: ${s.v}"></i>`).join('') : ''}</div><span class="hb-v">${esc(r.note ?? '')}</span></div>`; }).join('')}</div>`;
}

/* ---------- shared figures ---------- */
function guestStats() {
  const L = S.guests.list, by = k => L.filter(g => g.rsvp === k).length;
  return { total: L.length, yes: by('yes'), no: by('no'), awaiting: L.length - by('yes') - by('no'), std: L.filter(g => g.std).length, inv: L.filter(g => g.inv).length, thanks: L.filter(g => g.thanks).length, noAddr: L.filter(g => !(g.street && g.city)).length };
}
function budgetCalc() {
  const b = S.budget, total = num(b.total);
  const cats = BUDGET_CATS.map(c => {
    const items = b.items.filter(i => i.cat === c.id), p = b.pct[c.id] === '' || b.pct[c.id] == null ? c.pct : num(b.pct[c.id]);
    return Object.assign({}, c, { items, p, suggested: total * p / 100, planned: sum(items, 'budget'), actual: sum(items, 'actual'), paid: sum(items, 'paid') });
  });
  const planned = sum(cats, 'planned'), actual = sum(cats, 'actual'), paid = sum(cats, 'paid');
  const projected = sum(b.items, i => num(i.actual) > 0 ? i.actual : i.budget);
  const owed = sum(b.items, i => Math.max(0, num(i.actual) - num(i.paid)));
  return { total, cats, planned, actual, paid, projected, owed, left: total - projected, pctSum: sum(cats, 'p') };
}
function checklistAll() {
  const c = S.checklist;
  return PHASES.map(ph => {
    const base = ph.tasks.map((t, i) => { const [text, hint] = t.split('|'); return { id: ph.id + '_' + i, text, hint }; });
    const extra = c.custom.filter(x => x.phase === ph.id).map(x => ({ id: x.id, text: x.text, custom: true }));
    let tasks = base.concat(extra); const ord = (c.order || {})[ph.id];
    if (ord) { const pos = id => { const k = ord.indexOf(id); return k < 0 ? 1e6 : k; }; tasks = tasks.map((t, k) => [t, pos(t.id), k]).sort((a, b) => a[1] - b[1] || a[2] - b[2]).map(x => x[0]); }
    return Object.assign({}, ph, { tasks, done: tasks.filter(t => c.done[t.id]).length });
  });
}
function currentPhaseId() {
  const d = parseD(S.settings.date); if (!d) return null;
  const months = (d - today()) / (86400000 * 30.44);
  if (months < 0) return 'after';
  let curId = PHASES[0].id;
  for (const ph of PHASES) { if (ph.id !== 'after' && months <= ph.from + 0.01) curId = ph.id; }
  return curId;
}
function phaseWhen(ph) {
  const d = parseD(S.settings.date); if (!d) return '';
  if (ph.id === 'after') return 'from ' + fmtShort(d);
  if (ph.id === 'p12') return 'before ' + fmtMon(monthsBefore(d, 12));
  if (ph.from < 1) return fmtShort(monthsBefore(d, ph.from));
  const a = monthsBefore(d, ph.from), b = monthsBefore(d, ph.to);
  return ph.from === ph.to ? fmtMon(a) : fmtMon(a) + ' – ' + fmtMon(b);
}

</script>
<script>
'use strict';
/* Home dashboard + the switchable charts used across tabs. */

const emptyChart = msg => `<p class="muted sm-t">${msg}</p>`;

function budgetChart(view) {
  const B = budgetCalc();
  if (view === 'cats') {
    const rows = B.cats.filter(c => c.planned > 0 || c.actual > 0).map(c => ({ label: c.name, bars: [{ v: c.planned, color: CH[1], name: 'Budgeted', show: money(c.planned) }, { v: c.actual, color: CH[0], name: 'Actual cost', show: money(c.actual) }], note: money(c.actual || c.planned) }));
    return rows.length ? hbars(rows, { legend: [{ color: CH[1], label: 'Budgeted' }, { color: CH[0], label: 'Actual cost' }], label: 'Budgeted and actual cost by category' }) : emptyChart('Add expenses on the Budget tab to compare what you planned with what things cost.');
  }
  if (view === 'suggest') {
    const rows = B.cats.map(c => ({ label: c.name, bars: [{ v: c.suggested, color: CH[3], name: 'Suggested', show: money(c.suggested) }, { v: c.planned, color: CH[1], name: 'Your plan', show: money(c.planned) }], note: money(c.suggested) }));
    return hbars(rows, { legend: [{ color: CH[3], label: 'Suggested for your budget' }, { color: CH[1], label: 'Your plan' }], label: 'Suggested and planned amounts by category' });
  }
  if (view === 'paid') {
    const unspent = Math.max(0, B.total - B.paid - B.owed);
    return donut([{ label: 'Paid', value: B.paid, show: money(B.paid), color: CH[2] }, { label: 'Still owed', value: B.owed, show: money(B.owed), color: CH[0] }, { label: 'Not yet committed', value: unspent, show: money(unspent), color: CH[3] }], pct(B.paid, B.total) + '%', 'paid');
  }
  const rows = S.budget.contributors.map(c => { const paid = sum(S.budget.items.filter(i => i.payer === c.id), 'paid'); return { label: c.name || 'Contributor', bars: [{ v: num(c.pledged), color: CH[3], name: 'Pledged', show: money(num(c.pledged)) }, { v: paid, color: CH[2], name: 'Paid so far', show: money(paid) }], note: money(paid) }; });
  return rows.some(r => r.bars.some(b => b.v > 0)) ? hbars(rows, { legend: [{ color: CH[3], label: 'Pledged' }, { color: CH[2], label: 'Paid so far' }], label: 'Contributions' }) : emptyChart('Enter pledges under “Who is contributing” on the Budget tab, and pick who paid on each expense.');
}
function rsvpChart(view) {
  const G = guestStats(), L = S.guests.list;
  if (!L.length) return emptyChart('Add guests on the Guest List tab to see responses here.');
  if (view === 'resp') return donut([{ label: 'Attending', value: G.yes, color: CH[2] }, { label: 'Declined', value: G.no, color: CH[0] }, { label: 'Awaiting reply', value: G.awaiting, color: CH[3] }], String(G.yes), 'attending');
  if (view === 'group') {
    const groups = [...S.guests.groups, ''].map(gr => { const l = L.filter(g => (g.group || '') === gr); return { gr, l }; }).filter(x => x.l.length);
    return stacks(groups.map(({ gr, l }) => { const y = l.filter(g => g.rsvp === 'yes').length, n = l.filter(g => g.rsvp === 'no').length; return { label: gr || 'No group', segs: [{ v: y, color: CH[2], name: 'Attending' }, { v: n, color: CH[0], name: 'Declined' }, { v: l.length - y - n, color: CH[3], name: 'Awaiting' }], note: y + ' of ' + l.length }; }), [{ color: CH[2], label: 'Attending' }, { color: CH[0], label: 'Declined' }, { color: CH[3], label: 'Awaiting' }]);
  }
  const yes = L.filter(g => g.rsvp === 'yes');
  if (!yes.length) return emptyChart('Meal counts appear once guests RSVP “Yes”.');
  const rows = S.guests.meals.map(m => ({ label: m, bars: [{ v: yes.filter(g => g.meal === m).length, color: CH[1] }], note: yes.filter(g => g.meal === m).length }));
  const none = yes.filter(g => !S.guests.meals.includes(g.meal)).length;
  if (none) rows.push({ label: 'Not chosen yet', bars: [{ v: none, color: CH[3] }], note: none });
  return hbars(rows, { label: 'Meal choices of attending guests' });
}
function planChart(view) {
  const P = checklistAll(), done = sum(P, 'done'), total = sum(P, p => p.tasks.length);
  if (view === 'phase') return hbars(P.map(p => ({ label: p.label, bars: [{ v: pct(p.done, p.tasks.length), color: CH[2], show: p.done + ' of ' + p.tasks.length + ' done' }], note: p.done + '/' + p.tasks.length })), { max: 100, track: true, label: 'Checklist progress by phase' });
  if (view === 'overall') return donut([{ label: 'Done', value: done, color: CH[2] }, { label: 'To do', value: total - done, color: CH[3] }], pct(done, total) + '%', 'complete');
  const G = guestStats(), n = Math.max(1, G.total);
  return hbars([['Save-the-dates sent', G.std], ['Invitations sent', G.inv], ['RSVPs received', G.yes + G.no], ['Thank-yous sent', G.thanks]].map(([l, v]) => ({ label: l, bars: [{ v, color: CH[1], show: v + ' of ' + G.total }], note: v + '/' + G.total })), { max: n, track: true, label: 'Mailing progress' });
}
const chartCard = (title, key, opts, fn, tone, tipText) => card(title, `<div class="chart">${fn(UI[key])}</div>`, { right: seg(key, opts), tone, tip: tipText });
const BUDGET_VIEWS = [['cats', 'Plan vs. actual'], ['suggest', 'Suggested'], ['paid', 'Paid'], ['who', 'Who paid']];
const RSVP_VIEWS = [['resp', 'Replies'], ['group', 'By group'], ['meals', 'Meals']];
const PLAN_VIEWS = [['phase', 'By phase'], ['overall', 'Overall'], ['mail', 'Mailings']];

function upNext() {
  const P = checklistAll(), curId = currentPhaseId(), i0 = Math.max(0, P.findIndex(p => p.id === curId));
  const out = [];
  for (const ph of P.slice(0, i0 + 1).concat(P.slice(i0 + 1))) for (const t of ph.tasks) if (!S.checklist.done[t.id] && out.length < 6) out.push({ t, ph });
  return out;
}
function paymentsDue() {
  return S.budget.items.filter(i => i.due && num(i.actual) - num(i.paid) > 0).sort((a, b) => a.due.localeCompare(b.due)).slice(0, 4);
}

VIEWS.home = {
  render() {
    const s = S.settings, d = parseD(s.date), n = daysTo(d), G = guestStats(), B = budgetCalc(), P = checklistAll();
    const done = sum(P, 'done'), total = sum(P, p => p.tasks.length), due = paymentsDue();
    const t = s.theme;
    const themeBtns = Object.entries(THEMES).map(([k, th]) => `<button type="button" class="sw" data-act="theme.set" data-v="${k}" aria-pressed="${t === k}"><span class="dots">${['a', 'c', 'p', 'g', 'b', 'y'].map(c => `<i style="background:${th[c]}"></i>`).join('')}</span>${th.name}</button>`).join('') +
      `<button type="button" class="sw" data-act="theme.set" data-v="custom" aria-pressed="${t === 'custom'}"><span class="dots">${['a', 'c', 'p', 'g', 'b'].map(c => `<i style="background:${esc(s.custom[c] || '#FF7F68')}"></i>`).join('')}</span>My own colors</button>`;
    return `
    <section class="hero">
      <div>
        <div class="hero-k">The wedding of</div>
        <h1>${esc(s.name1 || 'You')} <i>&amp;</i> ${s.name2 ? esc(s.name2) : '<span class="ph-name">your partner</span>'}</h1>
        <div class="hero-d">${d ? esc(fmtLong(d)) : 'Date to be decided'}${s.venue ? ' · ' + esc(s.venue) : ''}</div>
        <div class="hero-c">${n == null ? '<span>Add your date below to start the countdown</span>' : n > 0 ? `<b>${n.toLocaleString('en-US')}</b><span>${n === 1 ? 'day' : 'days'} to go</span>` : `<span>${esc(countdownText())}</span>`}</div>
      </div>
      ${frame('settings.hero', 'arch', 'Add an engagement photo')}
    </section>
    ${sampleNote()}
    ${s.started ? '' : card('How this planner works', `<ol class="steps">
        <li><b>Make it yours</b>Add your names, date and colors at the bottom of this page. The countdown shows on every tab.</li>
        <li><b>Start with guests and budget</b>Those two numbers shape everything else. Guests who RSVP “Yes” flow into the Seating Chart on their own.</li>
        <li><b>Follow the checklist</b>It runs from 12 months out to after the wedding and marks where you are today.</li>
        <li><b>Look for the ? marks</b>Hover or tap one for a short explanation. Turn them off any time with “Tips on” at the top.</li>
      </ol>`, { right: '<button class="btn ghost sm" data-act="started">Got it, hide this</button>' })}
    <div class="tiles">
      <div class="tile" data-tone="b"><small>Guests</small><b>${G.yes} <span style="font:500 15px var(--f-b)">of ${G.total} attending</span></b><span>${G.awaiting} awaiting reply</span></div>
      <div class="tile ${B.left < 0 ? 'bad' : ''}" data-tone="g"><small>Budget</small><b>${money(B.projected)}</b><span>of ${money(B.total)} planned or spent</span></div>
      <div class="tile" data-tone="y"><small>Checklist</small><b>${pct(done, total)}%</b><span>${done} of ${total} tasks done</span></div>

      ${chartCard('RSVPs', 'chartRsvp', RSVP_VIEWS, rsvpChart, 'b', 'Switch between overall replies, replies by guest group, and meal counts.')}

    </div>

      ${t === 'custom' ? `<div class="row">${[['a', 'Main'], ['p', 'Soft'], ['g', 'Second'], ['b', 'Third'], ['c', 'Fourth'], ['bg', 'Background']].map(([k, l]) => `<label class="row sm-t" style="gap:6px"><input type="color" data-bind="settings.custom.${k}" data-hook="theme" value="${esc(s.custom[k] || '#FF7F68')}">${l}</label>`).join('')}</div>` : ''}
      <div><h3 style="margin-bottom:8px">Your photos${tip('Add engagement photos or anything that makes this feel like yours. They are resized before saving.')}</h3><div class="photos3">${frame('settings.photo2', '', 'Add a photo')}${frame('settings.photo3', '', 'Add a photo')}${frame('settings.photo4', '', 'Add a photo')}</div></div>
    `, { tone: 'a' })}
    ${shareCard()}`;
  }
};

<script>
'use strict';
/* Guest list and seating chart. */

const GROUP_COLORS = ['var(--a)', 'var(--b)', 'var(--g)', 'var(--y)', 'var(--c)', 'var(--b-deep)', 'var(--g-deep)', 'var(--a-deep)'];
const groupColor = name => { const i = S.guests.groups.indexOf(name); return i < 0 ? 'var(--line)' : GROUP_COLORS[i % GROUP_COLORS.length]; };
const guestName = g => [g.first, g.last].filter(Boolean).join(' ') || 'Unnamed guest';
const RSVP_OPTS = [['awaiting', 'Awaiting'], ['yes', 'Yes'], ['no', 'No']];
const GUEST_COLS = [['first', 'First name'], ['last', 'Last name'], ['party', 'Name on envelope'], ['group', 'Group'], ['street', 'Street'], ['city', 'City'], ['state', 'State'], ['zip', 'ZIP'], ['email', 'Email'], ['phone', 'Phone']];

function guestRowsTSV(all) {
  const L = S.guests.list, tname = id => (S.seating.tables.find(t => t.id === id) || {}).name || '';
  if (!all) {
    const seen = new Set(), rows = [['Name on envelope', 'Street', 'City', 'State', 'ZIP']];
    L.forEach(g => { const name = g.party || guestName(g), key = name + '|' + g.street; if (seen.has(key)) return; seen.add(key); rows.push([name, g.street, g.city, g.state, g.zip]); });
    return rows;
  }

}
const toTSV = rows => rows.map(r => r.map(c => String(c ?? '').replace(/[\t\n]/g, ' ')).join('\t')).join('\n');
const toCSV = rows => rows.map(r => r.map(c => { c = String(c ?? ''); return /[",\n]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c; }).join(',')).join('\n');

    const txt = (g, k, label, w) => `<input type="text" data-bind="guests.list.#${g.id}.${k}" value="${esc(g[k] || '')}" aria-label="${label}" data-quiet style="min-width:${w}px">`;
    const chk = (g, k, label) => `<input type="checkbox" data-bind="guests.list.#${g.id}.${k}"${g[k] ? ' checked' : ''} aria-label="${label}">`;

    </tr></thead><tbody>${rows || `<tr><td colspan="19" class="empty">${gs.list.length ? 'No guests match this filter.' : 'No guests yet. Add one, or paste a list from a spreadsheet.'}</td></tr>`}</tbody></table></div>

        <label class="field">Meal choices, separated by commas${tip('These appear in the Meal column and in the caterer counts. Leave empty for a buffet.')}<input type="text" data-list="guests.meals" value="${esc(gs.meals.join(', '))}"></label>

VIEWS.seating = {
  render() {
    const tables = S.seating.tables, yes = S.guests.list.filter(g => g.rsvp === 'yes'), meals = S.guests.meals;
    const at = id => yes.filter(g => g.table === id), q = UI.seatQ.trim().toLowerCase();

    const mealLine = l => { const parts = meals.map(m => [m, l.filter(g => g.meal === m).length]).filter(x => x[1]).map(x => x[0] + ' ' + x[1]); const none = l.filter(g => !meals.includes(g.meal)).length; if (none && meals.length) parts.push('no choice ' + none); return parts.join(' · '); };
    const cards = tables.map(t => {
      const l = at(t.id), over = l.length - num(t.cap);
      return `<div class="tcard ${over > 0 ? 'over' : ''}" data-drop="${t.id}">
        <div class="tcard-h"><input type="text" data-bind="seating.tables.#${t.id}.name" value="${esc(t.name)}" aria-label="Table name" data-quiet><input class="num cap boxed" data-type="num" inputmode="numeric" data-bind="seating.tables.#${t.id}.cap" value="${esc(t.cap)}" aria-label="Seats at this table" data-tip="Seats at this table"><button class="x" data-act="table.del" data-id="${t.id}" aria-label="Remove ${esc(t.name)}">×</button></div>

        ${l.map(g => `<div class="seat" draggable="true" data-gid="${g.id}" style="--gc:${groupColor(g.group)}"><span>${esc(guestName(g))}${g.diet ? `<small>${esc(g.diet)}</small>` : ''}</span>${g.meal ? pill(g.meal, 'g') : ''}<button class="x" data-act="seat.remove" data-id="${g.id}" aria-label="Unseat ${esc(guestName(g))}" data-tip="Move back to “Not yet seated”">×</button></div>`).join('')}

    }).join('');
    const sumRow = (name, l) => `<tr><td><span class="calc l">${esc(name)}</span></td>${meals.map(m => `<td class="c">${l.filter(g => g.meal === m).length || ''}</td>`).join('')}<td class="c">${l.filter(g => !meals.includes(g.meal)).length || ''}</td><td><span class="calc l">${esc(l.filter(g => g.diet).map(g => guestName(g) + ': ' + g.diet).join('; '))}</span></td><td class="c">${l.length}</td></tr>`;
    const seated = yes.filter(g => tables.some(t => t.id === g.table));
    return `${head('Seating Chart', 'Everyone who RSVPs “Yes” lands in “Not yet seated”. Drag a name onto a table, or use the menu on each table. Meals and dietary notes come along from the Guest List.',
      `<button class="btn" data-act="table.add">+ Add a table</button>`)}
    ${sampleNote()}
    <div class="seat-wrap">
      <section class="card unseated" data-drop="" data-tone="y"><div class="card-h"><h2>Not yet seated${tip('Each guest can only be seated once. Dragging someone to a new table moves them, so nobody ends up in two seats.')}</h2>${pill(String(un.length), 'y')}</div>
        <input class="boxed" type="text" data-ui="seatQ" value="${esc(UI.seatQ)}" placeholder="Search" aria-label="Search unseated guests">
        ${unShown.map(g => `<div class="gchip" draggable="true" data-gid="${g.id}" style="--gc:${groupColor(g.group)}"><span>${esc(guestName(g))}</span><small>${esc(g.meal || '')}</small></div>`).join('') || `<p class="muted sm-t">${un.length ? 'No match.' : yes.length ? 'Everyone attending has a seat.' : 'Guests appear here when their RSVP is “Yes”.'}</p>`}
      </section>
      <div class="stack"><div class="tables">${cards || '<p class="muted">Add your first table to start seating guests.</p>'}</div></div>
    </div>
    ${card('For your caterer', `<div class="tw" id="cater-tw" data-keep-scroll data-tone="g"><table class="et"><thead><tr><th>Table</th>${meals.map(m => `<th class="c">${esc(m)}</th>`).join('')}<th class="c">No choice yet</th><th>Dietary notes</th><th class="c">Guests</th></tr></thead>
      <tbody>${tables.map(t => sumRow(t.name, at(t.id))).join('') || '<tr><td class="empty" colspan="9">No tables yet.</td></tr>'}</tbody>
      <tfoot><tr><td>Total seated</td>${meals.map(m => `<td class="c">${seated.filter(g => g.meal === m).length}</td>`).join('')}<td class="c">${seated.filter(g => !meals.includes(g.meal)).length}</td><td></td><td class="c">${seated.length}</td></tr></tfoot></table></div>`,
      { tone: 'g', tip: 'How many of each meal goes to each table, plus any dietary notes. Copy it and send it to your catering team.', right: '<button class="btn ghost sm" data-act="seat.copy">Copy for caterer</button>' })}`;
  }
};

function cateringTSV() {
  const tables = S.seating.tables, meals = S.guests.meals, yes = S.guests.list.filter(g => g.rsvp === 'yes');
  const rows = [['Table'].concat(meals, ['No choice yet', 'Dietary notes', 'Guests'])];
  tables.forEach(t => { const l = yes.filter(g => g.table === t.id); rows.push([t.name].concat(meals.map(m => l.filter(g => g.meal === m).length), [l.filter(g => !meals.includes(g.meal)).length, l.filter(g => g.diet).map(g => guestName(g) + ': ' + g.diet).join('; '), l.length])); });
  return toTSV(rows);
}

<script>
'use strict';
/* Interactive floor plan: add shapes, drag, resize, rotate. Units are feet. */

const FP_PRESETS = [
  { k: 'round', name: 'Round table', icon: 'c', kind: 'circle', w: 5, h: 5, seats: 8, fill: 'p', label: 'Table' },
  { k: 'long', name: 'Long table', icon: 'w', kind: 'rect', w: 8, h: 2.5, seats: 8, fill: 'p', label: 'Table' },
  { k: 'sweet', name: 'Sweetheart table', icon: 'w', kind: 'rect', w: 5, h: 2.5, seats: 2, one: true, fill: 'a', label: 'Sweetheart' },
  { k: 'chair', name: 'Chair', icon: '', kind: 'rect', w: 1.5, h: 1.5, seats: 0, fill: 'n', label: '' },
  { k: 'row', name: 'Row of chairs', icon: 'w', kind: 'rect', w: 10.5, h: 1.5, seats: 0, fill: 'n', label: '', chairs: true },
  { k: 'dance', name: 'Dance floor', icon: '', kind: 'rect', w: 16, h: 16, seats: 0, fill: 'b', label: 'Dance floor' },
  { k: 'bar', name: 'Bar', icon: 'w', kind: 'rect', w: 8, h: 3, seats: 0, fill: 'g', label: 'Bar' },
  { k: 'dj', name: 'DJ or band', icon: 'w', kind: 'rect', w: 8, h: 5, seats: 0, fill: 'y', label: 'DJ' },
  { k: 'buffet', name: 'Buffet', icon: 'w', kind: 'rect', w: 8, h: 2.5, seats: 0, fill: 'g', label: 'Buffet' },
  { k: 'cake', name: 'Cake table', icon: 'c', kind: 'circle', w: 3, h: 3, seats: 0, fill: 'y', label: 'Cake' },
  { k: 'gifts', name: 'Gifts & cards', icon: 'w', kind: 'rect', w: 6, h: 2.5, seats: 0, fill: 'y', label: 'Gifts' },
  { k: 'arch', name: 'Arch or altar', icon: 'w', kind: 'rect', w: 7, h: 1.5, seats: 0, fill: 'g', label: 'Arch' },
  { k: 'circle', name: 'Circle', icon: 'c', kind: 'circle', w: 4, h: 4, seats: 0, fill: 'w', label: '' },
  { k: 'rect', name: 'Rectangle', icon: '', kind: 'rect', w: 6, h: 4, seats: 0, fill: 'w', label: '' },
  { k: 'text', name: 'Text label', icon: 't', kind: 'text', w: 8, h: 2, seats: 0, fill: 'w', label: 'Label' }
];
const FP_FILLS = { p: 'var(--p-soft)', a: 'var(--a-soft)', g: 'var(--g-soft)', b: 'var(--b-soft)', y: 'var(--y-soft)', c: 'var(--c-soft)', n: 'var(--track)', w: '#fff' };
const FP_FILL_NAMES = { p: 'Peach', a: 'Accent', g: 'Green', b: 'Blue', y: 'Gold', c: 'Coral', n: 'Gray', w: 'White' };
let fpDrag = null;
const fpShape = id => S.floor.shapes.find(s => s.id === id);
const r2 = n => Math.round(n * 100) / 100;

function fpChairs(s) {
  const n = Math.max(0, Math.round(num(s.seats))), c = 1.3, out = [];
  const chair = (x, y, rot) => out.push(`<rect class="fp-chair" x="${r2(x - c / 2)}" y="${r2(y - c / 2)}" width="${c}" height="${c}" rx=".3" transform="rotate(${r2(rot)} ${r2(x)} ${r2(y)})"></rect>`);
  if (s.chairs) { const k = Math.max(1, Math.floor(s.w / 1.7)); for (let i = 0; i < k; i++) chair(-s.w / 2 + s.w * (i + 0.5) / k, 0, 0); return out.join(''); }
  if (!n) return '';
  if (s.kind === 'circle') { const rx = s.w / 2 + 0.85, ry = s.h / 2 + 0.85; for (let i = 0; i < n; i++) { const a = (i / n) * 2 * Math.PI - Math.PI / 2; chair(Math.cos(a) * rx, Math.sin(a) * ry, a * 180 / Math.PI + 90); } }
  else {
    const top = s.one ? 0 : Math.floor(n / 2), bot = n - top;
    for (let i = 0; i < bot; i++) chair(-s.w / 2 + s.w * (i + 0.5) / bot, s.h / 2 + 0.85, 0);
    for (let i = 0; i < top; i++) chair(-s.w / 2 + s.w * (i + 0.5) / top, -s.h / 2 - 0.85, 0);
  }
  return out.join('');
}
function fpLabel(s) {
  const t = s.table ? S.seating.tables.find(x => x.id === s.table) : null;
  if (!t) return { main: s.label || '', sub: '' };
  const n = S.guests.list.filter(g => g.rsvp === 'yes' && g.table === t.id).length;
  return { main: t.name, sub: n + '/' + num(t.cap) + ' seated' };
}
function fpDrawShape(s) {
  const sel = UI.fpSel === s.id, L = fpLabel(s), fill = FP_FILLS[s.fill] || '#fff';
  const body = s.kind === 'text' ? `<rect class="body" x="${-s.w / 2}" y="${-s.h / 2}" width="${s.w}" height="${s.h}" fill="transparent" stroke-dasharray="${sel ? '.4 .3' : '0 99'}"></rect>`
    : s.chairs ? `<rect class="body" x="${-s.w / 2}" y="${-s.h / 2}" width="${s.w}" height="${s.h}" fill="transparent" style="stroke-width:${sel ? .22 : 0}"></rect>`
    : s.kind === 'circle' ? `<ellipse class="body" rx="${s.w / 2}" ry="${s.h / 2}" fill="${fill}"></ellipse>`
    : `<rect class="body" x="${-s.w / 2}" y="${-s.h / 2}" width="${s.w}" height="${s.h}" rx=".25" fill="${fill}"></rect>`;
  const fs = Math.max(0.5, Math.min(1.15, s.w / Math.max(4, (L.main.length || 1) * 0.58), s.h * (L.sub ? 0.3 : 0.55)));
  const tfs = s.kind === 'text' ? Math.max(0.7, Math.min(s.h * 0.62, s.w / Math.max(1, L.main.length) * 1.7)) : fs;
  const text = L.main || L.sub ? `<g transform="rotate(${-s.rot})"><text text-anchor="middle" y="${L.sub ? -0.1 : tfs * 0.35}" font-size="${r2(tfs)}">${esc(L.main)}</text>${L.sub ? `<text text-anchor="middle" y="${r2(fs * 0.95)}" font-size="${r2(fs * 0.72)}" style="font-weight:500;fill:var(--muted)">${esc(L.sub)}</text>` : ''}</g>` : '';
  const handles = sel ? `<line class="fp-hl" x1="0" y1="${-s.h / 2}" x2="0" y2="${-s.h / 2 - 2}"></line><circle class="fp-h rot" data-h="rotate" cx="0" cy="${-s.h / 2 - 2}" r=".6"></circle><circle class="fp-h" data-h="resize" cx="${s.w / 2}" cy="${s.h / 2}" r=".65"></circle>` : '';
  return `<g class="fp-s ${sel ? 'sel' : ''}" data-sid="${s.id}" transform="translate(${r2(s.x)} ${r2(s.y)}) rotate(${r2(s.rot)})">${s.chairs ? '' : fpChairs(s)}${body}${s.chairs ? fpChairs(s) : ''}${text}${handles}</g>`;
}
function fpInner() {
  const f = S.floor, W = num(f.w) || 60, H = num(f.h) || 40; let grid = '';
  for (let x = 1; x < W; x++) grid += `<line class="fp-grid ${x % 5 ? '' : 'maj'}" x1="${x}" y1="0" x2="${x}" y2="${H}"></line>`;
  for (let y = 1; y < H; y++) grid += `<line class="fp-grid ${y % 5 ? '' : 'maj'}" x1="0" y1="${y}" x2="${W}" y2="${y}"></line>`;
  const shapes = f.shapes.slice(), i = shapes.findIndex(s => s.id === UI.fpSel);
  if (i >= 0) shapes.push(shapes.splice(i, 1)[0]);
  return `<rect class="fp-room" x="0" y="0" width="${W}" height="${H}"></rect>${grid}${shapes.map(fpDrawShape).join('')}`;
}
function fpInspector() {
  const s = fpShape(UI.fpSel);
  if (!s) return `<p class="muted sm-t">Click a shape to edit it. Drag to move it, pull the round white handle to resize, and the dark handle to rotate.</p>`;
  const b = k => `floor.shapes.#${s.id}.${k}`;
  const tables = S.seating.tables.map(t => [t.id, t.name]);
  return `<div class="fields" style="grid-template-columns:1fr 1fr">
      ${s.table ? '' : `<label class="field" style="grid-column:1/-1">Label<input type="text" data-bind="${b('label')}" value="${esc(s.label || '')}"></label>`}
      <label class="field">Width (ft)<input class="num" data-type="num" inputmode="decimal" data-bind="${b('w')}" data-hook="fpSize" value="${r2(s.w)}"></label>
      <label class="field">${s.kind === 'circle' ? 'Depth (ft)' : 'Depth (ft)'}<input class="num" data-type="num" inputmode="decimal" data-bind="${b('h')}" data-hook="fpSize" value="${r2(s.h)}"></label>
      <label class="field">Turn (°)<input class="num" data-type="num" inputmode="numeric" data-bind="${b('rot')}" value="${Math.round(s.rot)}"></label>
      ${s.kind !== 'text' && !s.chairs ? `<label class="field">Chairs${tip('Chairs are drawn around the table. Set to 0 for none.')}<input class="num" data-type="num" inputmode="numeric" data-bind="${b('seats')}" value="${num(s.seats)}"></label>` : ''}
    </div>
    ${s.kind === 'rect' && num(s.seats) > 0 ? `<label class="row sm-t"><input type="checkbox" data-bind="${b('one')}"${s.one ? ' checked' : ''}>Chairs on one side only</label>` : ''}
    ${s.kind !== 'text' && !s.chairs ? `<label class="field">Link to a seating chart table${tip('Shows the table’s name and how many guests are seated there.')}<select data-bind="${b('table')}" data-hook="fpLink">${options(tables, s.table, 'Not linked')}</select></label>
    <div><div class="field" style="margin-bottom:6px">Color</div><div class="fills">${Object.keys(FP_FILLS).map(k => `<button type="button" style="background:${FP_FILLS[k]}" data-act="fp.fill" data-v="${k}" aria-pressed="${s.fill === k}" aria-label="${FP_FILL_NAMES[k]}" data-tip="${FP_FILL_NAMES[k]}"></button>`).join('')}</div></div>` : ''}
    <div class="row"><button class="btn ghost sm" data-act="fp.dup">Duplicate</button><button class="btn ghost sm" data-act="fp.del">Delete</button></div>`;
}

VIEWS['floor-plan'] = {
  render() {
    const f = S.floor, W = num(f.w) || 60, H = num(f.h) || 40;
    const unplaced = S.seating.tables.filter(t => !f.shapes.some(s => s.table === t.id)).length;
    return `${head('Floor Plan', 'Lay out your room to scale. Add tables and other pieces, then drag them where you want them. Each small square is 1 foot; darker lines mark every 5 feet.')}
    ${sampleNote()}
    <div class="fp">
      <div class="stack">
        <div class="row">
          <label class="row sm-t">Room${tip('The size of your reception space in feet. Ask your venue for dimensions or a floor plan.')}<input class="num boxed" style="width:64px" data-type="num" inputmode="numeric" data-bind="floor.w" value="${W}" aria-label="Room width in feet"> × <input class="num boxed" style="width:64px" data-type="num" inputmode="numeric" data-bind="floor.h" value="${H}" aria-label="Room depth in feet"> ft</label>
          <label class="row sm-t"><input type="checkbox" data-bind="floor.snap"${f.snap ? ' checked' : ''}>Snap to half-foot grid</label>
          <span class="top-sp"></span>
          ${unplaced ? `<button class="btn ghost sm" data-act="fp.fromSeating" data-tip="Adds a round table for every seating-chart table that is not on the plan yet">Add my ${plural(unplaced, 'seating table')}</button>` : ''}
        </div>
        <div class="fp-stage"><svg id="fp-svg" viewBox="-1.5 -3.5 ${W + 3} ${H + 5}" role="application" aria-label="Floor plan canvas">${fpInner()}</svg></div>
        <p class="muted sm-t">Keyboard: arrow keys nudge the selected shape, Delete removes it. On a phone or tablet, drag with one finger.</p>
      </div>
      <div class="stack">
        ${card('Add to the room', `<div class="fp-add">${FP_PRESETS.map(p => `<button type="button" data-act="fp.add" data-v="${p.k}"><i class="${p.icon}">${p.icon === 't' ? 'T' : ''}</i>${p.name}</button>`).join('')}</div>`, { tone: 'b', tip: 'New pieces appear in the middle of the room. Drag them into place.' })}
        ${card('Selected shape', `<div id="fp-insp" class="stack" style="gap:12px">${fpInspector()}</div>`, { tone: 'a' })}
      </div>
    </div>`;
  },
  after() {
    const svg = $('#fp-svg'); if (!svg) return;
    const pt = e => { const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); };
    const redraw = () => { svg.innerHTML = fpInner(); };
    const snap = v => S.floor.snap ? Math.round(v * 2) / 2 : r2(v);
    svg.addEventListener('pointerdown', e => {
      const p = pt(e), h = e.target.closest('[data-h]'), g = e.target.closest('[data-sid]');
      const before = UI.fpSel;
      if (h && UI.fpSel) fpDrag = { mode: h.dataset.h, id: UI.fpSel };
      else if (g) { UI.fpSel = g.dataset.sid; const s = fpShape(UI.fpSel); fpDrag = { mode: 'move', id: s.id, dx: p.x - s.x, dy: p.y - s.y }; }
      else { UI.fpSel = null; fpDrag = null; }
      try { svg.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
      redraw(); if (before !== UI.fpSel) $('#fp-insp').innerHTML = fpInspector();
      e.preventDefault();
    });
    svg.addEventListener('pointermove', e => {
      if (!fpDrag) return; const s = fpShape(fpDrag.id); if (!s) return; const p = pt(e), W = num(S.floor.w), H = num(S.floor.h);
      if (fpDrag.mode === 'move') { s.x = Math.max(0, Math.min(W, snap(p.x - fpDrag.dx))); s.y = Math.max(0, Math.min(H, snap(p.y - fpDrag.dy))); }
      else if (fpDrag.mode === 'resize') {
        const a = -s.rot * Math.PI / 180, dx = p.x - s.x, dy = p.y - s.y;
        let w = Math.max(1, snap(Math.abs(dx * Math.cos(a) - dy * Math.sin(a)) * 2)), hh = Math.max(1, snap(Math.abs(dx * Math.sin(a) + dy * Math.cos(a)) * 2));
        if (s.kind === 'circle' && !e.shiftKey) { w = hh = Math.max(w, hh); }
        if (s.chairs) hh = 1.5;
        s.w = w; s.h = hh;
      } else { const ang = Math.atan2(p.y - s.y, p.x - s.x) * 180 / Math.PI + 90; s.rot = ((Math.round(ang / 15) * 15) % 360 + 360) % 360; }
      fpDrag.moved = true; redraw();
    });
    const end = () => { if (fpDrag && fpDrag.moved) { Store.save('floor'); $('#fp-insp').innerHTML = fpInspector(); } fpDrag = null; };
    svg.addEventListener('pointerup', end); svg.addEventListener('pointercancel', end);
  }
};

function fpKey(e) {
  if (cur !== 'floor-plan' || !UI.fpSel) return;
  if (/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
  const s = fpShape(UI.fpSel); if (!s) return;
  const step = e.shiftKey ? 2 : 0.5, mv = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] }[e.key];
  if (mv) { s.x = r2(s.x + mv[0]); s.y = r2(s.y + mv[1]); Store.save('floor'); $('#fp-svg').innerHTML = fpInner(); e.preventDefault(); }
  else if (e.key === 'Delete' || e.key === 'Backspace') { ACT['fp.del'](); e.preventDefault(); }
  else if (e.key === 'Escape') { UI.fpSel = null; render(); }
}

</script>
<script>

VIEWS.budget = {

        <div class="cat-b">

            foot: c.items.length > 1 ? `<tfoot><tr><td>Total</td><td class="n" style="text-align:right">${money(c.planned)}</td><td style="text-align:right">${money(c.actual)}</td><td></td><td style="text-align:right">${money(c.paid)}</td><td style="text-align:right">${money(Math.max(0, c.actual - c.paid))}</td><td colspan="4"></td></tr></tfoot>` : '' })}

      <div class="tile" data-tone="b"><small>Budgeted${tip('The sum of the Budget column across all expenses.')}</small><b>${money(B.planned)}</b><span>${pct(B.planned, B.total)}% of overall</span></div>

    </div>
    <div class="grid g2 top">
      ${chartCard('See it', 'chartBudget', BUDGET_VIEWS, budgetChart, 'g', 'Four views: plan vs. actual by category, the suggested split, how much is paid, and who has paid what.')}
      ${card('Suggested budget by category', `

        <div class="tw" id="sug-tw" data-keep-scroll><table class="et sug"><thead><tr><th>Category</th><th>% of budget</th><th style="text-align:right">Suggested</th><th style="text-align:right">You budgeted</th></tr></thead><tbody>
        ${B.cats.map(c => `<tr data-tone="${c.tone}"><td><span class="dot"></span>${esc(c.name)}</td><td><input class="num" data-type="num" inputmode="decimal" data-bind="budget.pct.${c.id}" value="${c.p}" aria-label="Percent for ${esc(c.name)}"></td><td class="n" data-sug="${c.p}">${money(c.suggested)}</td><td class="n ${c.planned > c.suggested + 0.5 ? 'neg' : ''}">${money(c.planned)}</td></tr>`).join('')}
        </tbody><tfoot><tr><td>Total</td><td class="${Math.abs(B.pctSum - 100) > 0.01 ? 'neg' : ''}" style="text-align:right">${r2(B.pctSum)}%</td><td style="text-align:right" data-sug="${B.pctSum}">${money(B.total * B.pctSum / 100)}</td><td style="text-align:right">${money(B.planned)}</td></tr></tfoot></table></div>
        <div class="row"><button class="btn ghost sm" data-act="budget.resetPct">Reset to the typical split</button>${Math.abs(B.pctSum - 100) > 0.01 ? '<span class="sm-t neg">Percentages should add up to 100.</span>' : ''}</div>`,
        { tone: 'g', tip: 'A starting point based on how U.S. couples typically divide a wedding budget, per The Knot’s survey. Change any percentage to match your priorities. If something is paid for separately, set it to 0 and raise another.' })}
    </div>
    ${card('Expense tracker', `<p class="muted sm-t">Open a category to add expenses. Each one shows its suggested amount next to what you have budgeted and spent.</p><div class="stack" style="gap:10px">${cats}</div>`, { tone: 'a' })}
    ${card('Who is contributing', etable({ id: 'bt-contrib', path: 'budget.contributors', rows: b.contributors, add: 'Add a contributor', blank: { name: '', pledged: '' },
      cols: [{ k: 'name', label: 'Name', live: true, w: 200 }, { k: 'pledged', label: 'Pledged', type: 'money', live: true, w: 120, tip: 'The amount this person has offered to contribute.' },
        { k: 'p', label: 'Paid so far', type: 'calc', fn: c => money(paidBy(c.id)), w: 120, tip: 'Adds up the Paid column for every expense where this person is “Paid by”.' },
        { k: 'l', label: 'Left of pledge', type: 'calc', fn: c => num(c.pledged) ? `<span class="${num(c.pledged) - paidBy(c.id) < 0 ? 'neg' : ''}">${money(num(c.pledged) - paidBy(c.id))}</span>` : '', w: 120 }],
      foot: `<tfoot><tr><td>Total</td><td style="text-align:right">${money(pledged)}</td><td style="text-align:right">${money(sum(b.contributors, c => paidBy(c.id)))}</td><td style="text-align:right">${pledged ? (pledged >= B.total ? 'Covers the budget' : money(B.total - pledged) + ' not yet covered') : ''}</td><td></td></tr></tfoot>` }),

HOOKS.budgetLive = () => {

<script>
'use strict';
/* Checklist, calendar, day-of timeline, sample timelines. */

/* ---------- checklist ---------- */
VIEWS.checklist = {
  render() {
    const P = checklistAll(), c = S.checklist, curId = currentPhaseId(), done = sum(P, 'done'), total = sum(P, p => p.tasks.length);
    UI.phOpen = UI.phOpen || {};
    const ci = P.findIndex(p => p.id === curId);
    const phases = P.map((ph, i) => {
      const open = UI.phOpen[ph.id] ?? (i === ci || i === ci + 1);
      const tasks = ph.tasks.filter(t => UI.clFilter === 'all' || (UI.clFilter === 'done') === !!c.done[t.id]);
      return `<details class="ph ${ph.id === curId ? 'now' : ''}" data-ph="${ph.id}"${open ? ' open' : ''}>
        <summary><span class="ph-t">${esc(ph.label)}</span><span class="ph-w">${esc(phaseWhen(ph))}</span>${ph.id === curId ? pill('You are here', 'a') : ''}
          <span class="ph-p">${ph.done} of ${ph.tasks.length}<span class="bar"><i style="width:${pct(ph.done, ph.tasks.length)}%"></i></span></span></summary>
        <div class="ph-b" data-sort="cl" data-ph="${ph.id}">${tasks.map(t => `<div class="task ${c.done[t.id] ? 'done' : ''}" data-sort-id="${t.id}">${grip()}<input type="checkbox" id="ck-${t.id}" data-bind="checklist.done.${t.id}"${c.done[t.id] ? ' checked' : ''}><span class="task-t"><label for="ck-${t.id}">${esc(t.text)}</label>${t.hint ? tip(t.hint) : ''}</span><input type="text" data-bind="checklist.who.${t.id}" value="${esc(c.who[t.id] || '')}" placeholder="Who is on it?" aria-label="Who is handling this" data-quiet>${t.custom ? `<button class="x" data-act="cl.del" data-id="${t.id}" aria-label="Remove task">×</button>` : '<span></span>'}</div>`).join('') || '<p class="muted sm-t" style="padding:8px 0">Nothing to show with this filter.</p>'}
          <form class="task-add" data-form="cl.add" data-ph="${ph.id}"><input type="text" name="t" placeholder="Add your own task to this phase" aria-label="New task"><button class="btn ghost sm" type="submit">Add</button></form></div></details>`;
    }).join('');
    return `${head('Checklist', 'Month by month, from a year out through the week of the wedding and the loose ends afterward. Dates are worked out from your wedding date. Drag the dotted handle to reorder tasks within a phase.', seg('clFilter', [['all', 'All'], ['todo', 'To do'], ['done', 'Done']]))}
    <div class="tiles"><div class="tile" data-tone="y"><small>Overall</small><b>${pct(done, total)}%</b><span>${done} of ${total} tasks done</span><div class="bar" style="margin-top:6px"><i style="width:${pct(done, total)}%"></i></div></div>
      <div class="tile" data-tone="a"><small>Where you are</small><b>${esc((P.find(p => p.id === curId) || {}).label || 'Set your date')}</b><span>${esc(countdownText())}</span></div></div>
    <div class="stack" style="gap:12px">${phases}</div>`;
  }
};

/* ---------- calendar ---------- */
function calEvents() {
  const out = [], d = parseD(S.settings.date), add = (date, title, tone) => { if (date) out.push({ date, title, tone }); };
  if (d) add(S.settings.date, 'Wedding day', 'a');
  add(S.guests.rsvpBy, 'RSVP deadline', 'b');
  S.budget.items.forEach(i => { if (i.due) add(i.due, 'Pay: ' + (i.name || 'expense'), 'g'); });
  OTHER_EVENTS.forEach(e => { const v = S.events[e.id]; if (v && v.date) add(v.date, e.name, 'p'); });
  if (d) PHASES.forEach(ph => { if (ph.id !== 'p12' && ph.id !== 'after' && ph.id !== 'd1') add(isoD(monthsBefore(d, ph.from)), 'Start: ' + ph.label + ' tasks', 'y'); });
  S.calendar.events.forEach(e => add(e.date, e.title || 'Untitled', 'b'));
  return out.sort((a, b) => a.date.localeCompare(b.date));
}
VIEWS.calendar = {
  render() {
    const now = today(); if (!UI.calMonth) UI.calMonth = isoD(now).slice(0, 7);
    const [y, m] = UI.calMonth.split('-').map(Number), first = new Date(y, m - 1, 1), start = new Date(y, m - 1, 1 - first.getDay());
    const evs = calEvents(), by = {}; evs.forEach(e => (by[e.date] = by[e.date] || []).push(e));
    let cells = '';
    for (let i = 0; i < 42; i++) {
      const dt = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i), iso = isoD(dt), l = by[iso] || [];
      if (i === 35 && dt.getMonth() !== m - 1) break;
      cells += `<button type="button" class="day ${dt.getMonth() !== m - 1 ? 'out' : ''} ${iso === isoD(now) ? 'today' : ''} ${iso === S.settings.date ? 'wed' : ''}" data-act="cal.add" data-v="${iso}" aria-label="${esc(fmtLong(dt))}${l.length ? ', ' + plural(l.length, 'item') : ''}"><span class="dn">${dt.getDate()}</span>${l.slice(0, 3).map(e => `<span class="ev" data-tone="${e.tone}" title="${esc(e.title)}">${esc(e.title)}</span>`).join('')}${l.length > 3 ? `<span class="muted">+${l.length - 3} more</span>` : ''}</button>`;
    }
    const soon = evs.filter(e => e.date >= isoD(now)).slice(0, 8);
    return `${head('Calendar', 'Fills itself in: your wedding day, payment due dates from the Budget, the RSVP deadline, other events, and the day each checklist phase begins. Click any day to add your own date.')}
    <div class="row"><button class="btn ghost sm" data-act="cal.nav" data-v="-1" aria-label="Previous month">←</button><h2 style="font:600 28px/1 var(--f-d);min-width:210px;text-align:center">${first.toLocaleDateString('en-US', { month: 'long', year: 'numeric' })}</h2><button class="btn ghost sm" data-act="cal.nav" data-v="1" aria-label="Next month">→</button>
      <span class="top-sp"></span><button class="btn ghost sm" data-act="cal.nav" data-v="today">Today</button>${S.settings.date ? '<button class="btn ghost sm" data-act="cal.nav" data-v="wed">Wedding month</button>' : ''}</div>
    <div class="cal">${['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(d => `<div class="dow">${d}</div>`).join('')}${cells}</div>
    ${legend([{ color: 'var(--a)', label: 'Wedding day' }, { color: 'var(--g)', label: 'Payments' }, { color: 'var(--y)', label: 'Checklist phases' }, { color: 'var(--p)', label: 'Other events' }, { color: 'var(--b)', label: 'Your dates & RSVP deadline' }])}
    <div class="grid g2">
      ${card('Coming up', `<ul class="todo-l">${soon.map(e => `<li><span>${esc(e.title)}<small>${esc(fmtLong(parseD(e.date)))}</small></span>${pill(daysTo(parseD(e.date)) === 0 ? 'Today' : 'in ' + plural(daysTo(parseD(e.date)), 'day'), e.tone)}</li>`).join('') || '<li><span class="muted">Nothing scheduled yet.</span></li>'}</ul>`, { tone: 'y' })}
      ${card('Your own dates', etable({ id: 'cal-own', path: 'calendar.events', rows: S.calendar.events.slice().sort((a, b) => (a.date || '').localeCompare(b.date || '')), add: 'Add a date', blank: { date: '', title: '', notes: '' }, empty: 'Tastings, fittings, vendor meetings, showers.',
        cols: [{ k: 'date', label: 'Date', type: 'date', live: true, w: 150 }, { k: 'title', label: 'What', w: 180 }, { k: 'notes', label: 'Notes', w: 160 }] }), { tone: 'b' })}
    </div>`;
  }
};

/* ---------- day-of timeline ---------- */
function buildTimeline(f) {
  const C = t2m(f.cer || '16:30'), len = num(f.len) || 30, fl = !!f.first, n = Math.max(1, num(f.hmu) || 4), recep = (num(f.recep) || 4) * 60, E = [];
  const add = (m, dur, title, who, flex) => E.push(Object.assign({ id: uid('e'), time: m2t(m), dur, title, where: '', who }, flex ? { flex: true } : {}));

let tlSnap = {};
function tlConflicts() {
